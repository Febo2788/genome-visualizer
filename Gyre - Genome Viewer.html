// Synteny view — N stacked linear genomes with BLAST ribbons between adjacent pairs.
// FIXES applied:
//  - Pan moves EVERYTHING (labels + left header block), like a PNG translation
//  - Midline thickness uses a sensible px-scaled value
//  - Labels overlay onto their row (forward top / reverse bottom) and de-overlap
//  - Ribbons flush to arrow edges (no stray label band at top)

function SyntenyView({
  genomeLen, features, labels,
  genomes,              // [{id, name, strain, color}, ...]
  synteny,              // [{from, to, pairs: [{a:[s,e], b:[s,e], identity, inverted}]}]
  hoveredId, setHoveredId, setSelectedFeature,
  paletteTick,

  // customizations
  config,
  syntenyLabels,
  syntenyHighlights,
  view,
  onViewChange,
  exportPreview,        // { width, height } — when set, container is fixed that size
  featuresMap,          // optional: {genomeId: features[]} for per-genome features
}) {
  const N = genomes.length;

  // vertical layout — no more label band at top; labels overlay the strip itself
  const headerH = 40;
  const rowH = 110;
  const ribbonH = 70;
  const totalH = headerH + N * rowH + (N - 1) * ribbonH + 20;

  const { zoom = 1, panX = 0, panY = 0 } = view || {};
  const cfg = {
    forwardColor: '#5B8AA6',
    invertedColor: '#B67777',
    midlineColor: '#C8C3B4',
    midlineThickness: 1.2,
    ribbonOpacityMin: 0.15,
    ribbonOpacityMax: 0.55,
    ribbonInset: 0,
    ...config,
  };

  const scrollRef = React.useRef(null);
  const panState = React.useRef(null);

  const defaultView = { zoom: 1, panX: 0, panY: 0 };
  const onWheel = (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const scale = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      onViewChange(v => { const s = v || defaultView; return { ...s, zoom: Math.max(0.5, Math.min(12, (s.zoom || 1) * scale)) }; });
    }
  };
  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    panState.current = { x: e.clientX, y: e.clientY, panX, panY };
  };
  const onMouseMove = (e) => {
    if (!panState.current) return;
    const dx = e.clientX - panState.current.x;
    const dy = e.clientY - panState.current.y;
    onViewChange(v => { const s = v || defaultView; return { ...s, panX: panState.current.panX + dx, panY: panState.current.panY + dy }; });
  };
  const endPan = () => { panState.current = null; };

  const containerStyle = exportPreview
    ? { width: exportPreview.width, height: exportPreview.height, margin: '0 auto',
        background: UI.bg, border: `1px dashed ${UI.divider}`, position: 'relative', overflow: 'hidden' }
    : { width: '100%', height: '100%', position: 'relative', background: UI.bg, overflow: 'hidden' };

  return (
    <div style={containerStyle}>
      <div
        ref={scrollRef}
        onWheel={onWheel}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={endPan}
        onMouseLeave={endPan}
        style={{
          width: '100%', height: '100%',
          overflow: 'hidden',
          cursor: panState.current ? 'grabbing' : 'grab',
          userSelect: 'none',
          position: 'relative',
        }}
      >
        {/* Everything below this point translates together as one PNG-like unit */}
        <div style={{
          position: 'absolute', left: 0, top: 0,
          width: '100%',
          transform: `translate(${panX}px, ${panY}px)`,
          transformOrigin: '0 0',
          padding: '0 16px',
          boxSizing: 'border-box',
        }}>
          <div style={{ position: 'relative', width: '100%', minHeight: totalH }}>

            <div style={{ height: headerH, display: 'flex', alignItems: 'flex-end',
                          paddingBottom: 6 }}>
              <div style={{ fontSize: 11, fontFamily: FONT_MONO, color: UI.muted,
                             textTransform: 'uppercase', letterSpacing: 0.5 }}>
                BLAST comparison · {N} genomes · identity shown by opacity
              </div>
            </div>

            {genomes.map((g, i) => {
              const stripY = headerH + i * (rowH + ribbonH);
              const nextStripY = stripY + rowH + ribbonH;
              const pair = i < N - 1 ? synteny.find(s => s.from === i && s.to === i + 1) : null;
              return (
                <React.Fragment key={g.id}>
                  <GenomeStrip
                    genome={g}
                    genomeId={g.id}
                    features={featuresMap?.[g.id] || features}
                    labels={syntenyLabels[g.id] || []}
                    highlights={syntenyHighlights[g.id] || []}
                    genomeLen={g.length} y={stripY} height={rowH}
                    isRef={i === 0}
                    hoveredId={hoveredId} setHoveredId={setHoveredId}
                    setSelectedFeature={setSelectedFeature}
                    midlineColor={cfg.midlineColor}
                    midlineThickness={cfg.midlineThickness}
                    zoom={zoom}
                  />
                  {pair && (
                    <RibbonBand
                      pairs={pair.pairs}
                      yTop={stripY + rowH}
                      yBot={nextStripY}
                      genomeLen={genomeLen}
                      forwardColor={cfg.forwardColor}
                      invertedColor={cfg.invertedColor}
                      opacityMin={cfg.ribbonOpacityMin}
                      opacityMax={cfg.ribbonOpacityMax}
                      ribbonInset={cfg.ribbonInset}
                      ribbonStyle={cfg.ribbonStyle}
                      zoom={zoom}
                    />
                  )}
                </React.Fragment>
              );
            })}
          </div>
        </div>
      </div>
      {!exportPreview && <SyntenyZoomControls view={{ zoom, panX, panY }} setView={onViewChange} />}
    </div>
  );
}

const LEFT_PAD = 150;
const RIGHT_PAD = 20;
// Row-internal layout (px-ish fractions of rowH)
const FORWARD_TOP_FRAC = 0.30;
const FORWARD_BOT_FRAC = 0.47;
const MID_FRAC         = 0.50;
const REVERSE_TOP_FRAC = 0.53;
const REVERSE_BOT_FRAC = 0.70;

// ============================================================
// Single genome strip — arrows + midline + overlay labels (de-overlapped, never upside down)
// Ribbons attach at row top (y=0) and row bottom (y=rowH) — flush with arrow rows.
// For flush, we put the forward strand exactly at top edge and reverse at bottom.
// ============================================================
function GenomeStrip({
  genome, features, labels, highlights,
  genomeLen, y, height, isRef,
  hoveredId, setHoveredId, setSelectedFeature,
  midlineColor, midlineThickness,
  zoom,
  genomeId,
}) {
  const colorMap = Object.fromEntries(
    Object.entries(FEATURE_CATEGORIES).map(([k, v]) => [k, v.color])
  );

  const stripRef = React.useRef(null);
  const [stripW, setStripW] = React.useState(800);
  React.useEffect(() => {
    if (stripRef.current) {
      const ro = new ResizeObserver((entries) => {
        setStripW(entries[0].contentRect.width);
      });
      ro.observe(stripRef.current);
      return () => ro.disconnect();
    }
  }, []);

  // Make forward strand flush with top of row, reverse flush with bottom
  // So ribbons (which attach to row edges) reach the arrow outer edges exactly.
  const stripInnerW = Math.max(1, stripW);
  const pxPerFrac = stripInnerW * zoom; // horizontal px per fractional 0..1

  // Compute label positions in px (horizontal)
  const labelPx = labels.map(l => {
    const xFrac = l.position / genomeLen;
    return { ...l, xFrac, x: xFrac * pxPerFrac };
  });

  // De-overlap per row; forward labels bubble upward, reverse labels bubble downward
  const forwardLabels = labelPx.filter(l => (l.strand ?? 1) >= 0);
  const reverseLabels = labelPx.filter(l => (l.strand ?? 1) < 0);

  const labelBounds = [24, Math.max(40, stripInnerW * zoom) - 24];
  const dodgedForward = deoverlapLabels1D(forwardLabels, 72, labelBounds);
  const dodgedReverse = deoverlapLabels1D(reverseLabels, 72, labelBounds);

  // Pixel y-positions within strip
  const forwardTopPx = FORWARD_TOP_FRAC * height;
  const forwardBotPx = FORWARD_BOT_FRAC * height;
  const midPx        = MID_FRAC * height;
  const reverseTopPx = REVERSE_TOP_FRAC * height;
  const reverseBotPx = REVERSE_BOT_FRAC * height;

  // Label vertical positions — above forward / below reverse
  const fwdLabelY = 14; // at top of strip
  const revLabelY = height - 6;

  return (
    <div ref={stripRef} style={{ position: 'absolute', left: 0, right: 0, top: y, height }}>
      {/* Left label block — INSIDE the panned container, so it moves when you pan */}
      <div style={{
        position: 'absolute', left: 0, top: 0, width: LEFT_PAD - 10,
        height: '100%', display: 'flex', flexDirection: 'column',
        justifyContent: 'center', gap: 2, paddingLeft: 4,
        pointerEvents: 'none',
      }}>
        <div style={{ fontSize: 14, fontFamily: FONT_SANS, fontWeight: 600,
                      color: UI.ink, fontStyle: 'italic',
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {genome.name}
        </div>
        <div style={{ fontSize: 11, fontFamily: FONT_MONO, color: UI.muted,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
          {genome.strain}
        </div>
        {isRef && (
          <div style={{ fontSize: 9, fontFamily: FONT_MONO, color: UI.accent,
                         textTransform: 'uppercase', letterSpacing: 0.6, marginTop: 2 }}>
            Reference
          </div>
        )}
      </div>

      {/* SVG strip — use pixel coordinates so labels stay upright and at fixed size */}
      <svg
        width={stripInnerW}
        height={height}
        style={{
          position: 'absolute', left: LEFT_PAD,
          top: 0, overflow: 'visible', userSelect: 'none',
        }}>

        {/* Background band tint — confined to the ARROW zone only, so it
            doesn't sit over the strip's top/bottom edges where ribbons attach.
            (Previously ran y=0..height, which visually "cut off" ribbon ends.) */}
        <rect x={0} y={forwardTopPx} width={stripInnerW * zoom}
              height={reverseBotPx - forwardTopPx}
              fill={genome.color} opacity={0}
              pointerEvents="none" />

        {/* Highlights */}
        {highlights.map((h, i) => {
          const x0 = (h.start / genomeLen) * pxPerFrac;
          const x1 = (h.end / genomeLen) * pxPerFrac;
          return (
            <rect key={i} x={x0} y={0} width={x1 - x0} height={height}
                  fill={h.color} opacity={h.opacity ?? 0.18} />
          );
        })}

        {/* Midline — width in real pixels, not scaled fraction */}
        <line x1={0} y1={midPx} x2={stripInnerW * zoom} y2={midPx}
              stroke={midlineColor} strokeWidth={Math.max(0.2, midlineThickness)} />

        {/* CDS arrows — every 2nd feature, in pixel space */}
        {features.filter((_, j) => j % 2 === 0).map((f) => {
          try {
            const x0 = (f.start / genomeLen) * pxPerFrac;
            const x1 = (f.end / genomeLen) * pxPerFrac;
            const w = x1 - x0;
            const onFwd = f.strand > 0;
            const yT = onFwd ? forwardTopPx : reverseTopPx;
            const yB = onFwd ? forwardBotPx : reverseBotPx;
            const h = yB - yT;
            const head = Math.min(w * 0.5, 6);
            const d = onFwd
              ? `M ${x0} ${yT} L ${x1 - head} ${yT} L ${x1} ${yT + h/2} L ${x1 - head} ${yB} L ${x0} ${yB} Z`
              : `M ${x1} ${yT} L ${x0 + head} ${yT} L ${x0} ${yT + h/2} L ${x0 + head} ${yB} L ${x1} ${yB} Z`;
            const handleClick = () => {
              console.log('[GenomeStrip] Feature clicked:', { id: f.id, uniqueId: f.uniqueId, product: f.product, category: f.category });
              console.log('[GenomeStrip] Feature object:', f);
              setSelectedFeature(f);
            };
            return (
              <path key={f.uniqueId || f.id} d={d} fill={colorMap[f.category]}
                    opacity={hoveredId === f.id ? 1 : 0.85}
                    onMouseEnter={() => { console.log('[GenomeStrip] Hover:', f.id); setHoveredId(f.id); }}
                    onMouseLeave={() => { console.log('[GenomeStrip] Unhover:', f.id); setHoveredId(null); }}
                    onClick={handleClick}
                    style={{ cursor: 'pointer' }} />
            );
          } catch (err) {
            console.error('[GenomeStrip] Error rendering feature:', f, err);
            return null;
          }
        })}

        {/* Forward labels — anchored above forward strand (top of row) */}
        {dodgedForward.map((l, i) => {
          const x = l.dodgedX !== undefined ? l.dodgedX : l.x;
          const anchorX = l.x;
          // Leader from label to actual position
          return (
            <g key={`fl-${i}`}>
              <line x1={x} y1={fwdLabelY + 3} x2={anchorX} y2={forwardTopPx - 1}
                    stroke={l.color || '#1A1A1A'} strokeWidth={0.6} opacity={0.6} />
              <text x={x} y={fwdLabelY}
                    textAnchor="middle"
                    fontSize={11} fontStyle="italic"
                    fontFamily="'IBM Plex Sans', sans-serif" fontWeight={500}
                    fill={l.color || '#1A1A1A'}>
                {l.name}
              </text>
            </g>
          );
        })}

        {/* Reverse labels — anchored below reverse strand (bottom of row) */}
        {dodgedReverse.map((l, i) => {
          const x = l.dodgedX !== undefined ? l.dodgedX : l.x;
          const anchorX = l.x;
          return (
            <g key={`rl-${i}`}>
              <line x1={anchorX} y1={reverseBotPx + 1} x2={x} y2={revLabelY - 10}
                    stroke={l.color || '#1A1A1A'} strokeWidth={0.6} opacity={0.6} />
              <text x={x} y={revLabelY}
                    textAnchor="middle"
                    fontSize={11} fontStyle="italic"
                    fontFamily="'IBM Plex Sans', sans-serif" fontWeight={500}
                    fill={l.color || '#1A1A1A'}>
                {l.name}
              </text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// ============================================================
// Ribbon band — connects genome[i] top to genome[i+1] bottom, flush.
// ============================================================
function RibbonBand({ pairs, yTop, yBot, genomeLen,
                     forwardColor, invertedColor,
                     opacityMin, opacityMax,
                     ribbonInset = 0,
                     ribbonStyle = 'curvy',
                     zoom }) {
  const height = yBot - yTop;
  const bandRef = React.useRef(null);
  const [bandW, setBandW] = React.useState(800);
  React.useEffect(() => {
    if (bandRef.current) {
      const ro = new ResizeObserver((entries) => {
        setBandW(entries[0].contentRect.width);
      });
      ro.observe(bandRef.current);
      return () => ro.disconnect();
    }
  }, []);

  const pxPerFrac = Math.max(1, bandW) * zoom;

  // IMPORTANT: ribbons must reach the arrow rows above and below.
  // Row internal fractions: forward bottom = 0.47 * prevRowH, reverse top = 0.53 * nextRowH.
  // Actually compute from row heights: rowH = 110 in current layout
  const rowH = 110;
  // `ribbonInset` (px) pushes ribbon attach points AWAY from arrow row edges
  // toward this band. At 0 ribbons kiss the arrow edges; larger values create
  // a visible gap from the midline/arrow.
  const yAttachTop = -(rowH - rowH * FORWARD_BOT_FRAC) + ribbonInset;
  const yAttachBot = height + rowH * REVERSE_TOP_FRAC   - ribbonInset;

  return (
    <svg ref={bandRef}
         width="100%"
         height={height}
         style={{
           position: 'absolute',
           left: LEFT_PAD,
           right: RIGHT_PAD,
           top: yTop,
           width: `calc(100% - ${LEFT_PAD + RIGHT_PAD}px)`,
           pointerEvents: 'none',
           userSelect: 'none',
           overflow: 'visible',
         }}>
      {pairs.map((p, i) => {
        const x0a = (p.a[0] / genomeLen) * pxPerFrac;
        const x1a = (p.a[1] / genomeLen) * pxPerFrac;
        const x0b = (p.b[0] / genomeLen) * pxPerFrac;
        const x1b = (p.b[1] / genomeLen) * pxPerFrac;
        const color = p.inverted ? invertedColor : forwardColor;
        const op = opacityMin + (p.identity - 0.7) / 0.3 * (opacityMax - opacityMin);
        const midY = (yAttachTop + yAttachBot) / 2;

        let d;
        if (p.inverted) {
          // Inverted: ribbon flips halfway through (visual rotation showing reversal)
          // Top: x0a to x1a
          // Bottom: x1b to x0b (reversed order shows the flip)
          if (ribbonStyle === 'straight') {
            d = `M ${x0a} ${yAttachTop} L ${x1b} ${yAttachBot} L ${x0b} ${yAttachBot} L ${x1a} ${yAttachTop} Z`;
          } else {
            // Curvy with flip: left side goes from x0a→x1b, right side goes from x1a→x0b
            d = `
              M ${x0a} ${yAttachTop}
              C ${x0a} ${midY}, ${x1b} ${midY}, ${x1b} ${yAttachBot}
              L ${x0b} ${yAttachBot}
              C ${x0b} ${midY}, ${x1a} ${midY}, ${x1a} ${yAttachTop}
              Z`;
          }
        } else {
          // Forward orientation: normal trapezoid/curve
          if (ribbonStyle === 'straight') {
            d = `M ${x0a} ${yAttachTop} L ${x0b} ${yAttachBot} L ${x1b} ${yAttachBot} L ${x1a} ${yAttachTop} Z`;
          } else {
            // Curvy (Bezier) — original style
            d = `
              M ${x0a} ${yAttachTop}
              C ${x0a} ${midY}, ${x0b} ${midY}, ${x0b} ${yAttachBot}
              L ${x1b} ${yAttachBot}
              C ${x1b} ${midY}, ${x1a} ${midY}, ${x1a} ${yAttachTop}
              Z`;
          }
        }
        return <path key={i} d={d} fill={color}
                     opacity={Math.max(opacityMin, Math.min(opacityMax, op))} />;
      })}
    </svg>
  );
}

// ============================================================
// De-overlap labels with a 1D force push (pixel coordinates).
// Each label gets a `dodgedX` that may differ from its anchor `x`.
// ============================================================
function deoverlapLabels1D(labels, minPx, bounds) {
  if (labels.length === 0) return [];
  const sorted = [...labels].sort((a, b) => a.x - b.x);
  sorted.forEach(l => { l.dodgedX = l.x; });
  for (let iter = 0; iter < 200; iter++) {
    let moved = false;
    for (let i = 0; i < sorted.length - 1; i++) {
      const a = sorted[i];
      const b = sorted[i + 1];
      const gap = b.dodgedX - a.dodgedX;
      if (gap < minPx) {
        const push = (minPx - gap) / 2 + 0.001;
        a.dodgedX -= push;
        b.dodgedX += push;
        moved = true;
      }
    }
    // Clamp to bounds if provided, then re-resolve neighbors
    if (bounds) {
      const [lo, hi] = bounds;
      for (let i = 0; i < sorted.length; i++) {
        if (sorted[i].dodgedX < lo) { sorted[i].dodgedX = lo; moved = true; }
        if (sorted[i].dodgedX > hi) { sorted[i].dodgedX = hi; moved = true; }
      }
      // Forward pass: ensure min spacing after clamping left
      for (let i = 1; i < sorted.length; i++) {
        const need = sorted[i - 1].dodgedX + minPx;
        if (sorted[i].dodgedX < need) {
          sorted[i].dodgedX = need;
          moved = true;
        }
      }
      // Backward pass: ensure min spacing after clamping right
      for (let i = sorted.length - 2; i >= 0; i--) {
        const need = sorted[i + 1].dodgedX - minPx;
        if (sorted[i].dodgedX > need) {
          sorted[i].dodgedX = need;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  return sorted;
}

// ============================================================
// Zoom controls for synteny view
// ============================================================
function SyntenyZoomControls({ view, setView }) {
  const safeView = view || { zoom: 1, panX: 0, panY: 0 };
  const btn = {
    width: 30, height: 30, padding: 0,
    background: UI.panel, border: `1px solid ${UI.border}`,
    color: UI.ink, fontSize: 14, fontFamily: FONT_MONO,
    cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
  };
  return (
    <div style={{
      position: 'absolute', right: 16, bottom: 16,
      display: 'flex', flexDirection: 'column', gap: 2,
      background: UI.bg, borderRadius: 4, padding: 4,
      boxShadow: '0 2px 8px rgba(0,0,0,0.08)',
      zIndex: 10,
    }}>
      <button style={btn} onClick={() => { const s = safeView || { zoom: 1, panX: 0, panY: 0 }; setView({ ...s, zoom: Math.min(12, s.zoom * 1.25) }); }}>+</button>
      <div style={{ fontSize: 9, fontFamily: FONT_MONO, color: UI.muted,
                     textAlign: 'center', padding: '2px 0' }}>
        {Math.round((safeView.zoom || 1) * 100)}%
      </div>
      <button style={btn} onClick={() => { const s = safeView || { zoom: 1, panX: 0, panY: 0 }; setView({ ...s, zoom: Math.max(0.5, s.zoom / 1.25) }); }}>−</button>
      <button style={{ ...btn, fontSize: 10 }}
              onClick={() => setView({ zoom: 1, panX: 0, panY: 0 })} title="Reset">⟲</button>
    </div>
  );
}

Object.assign(window, {
  SyntenyView, GenomeStrip, RibbonBand,

// ============================================================
// Track editor
// ============================================================
function findComplement(track, tracks) {
  const cdsTracks = tracks.filter(t => t.type === 'cds' && t.id !== track.id && t.strand !== track.strand);
  if (!cdsTracks.length) return null;
  // Prefer same import prefix (e.g. t-user-1234 or t-gb-1234)
  const prefix = track.id.replace(/-(?:fwd|rev)$/, '');
  const sameSource = cdsTracks.find(t => t.id.startsWith(prefix));
  if (sameSource) return sameSource;
  // Fallback: closest by radius
  return cdsTracks.reduce((best, t) =>
    Math.abs(t.radius - track.radius) < Math.abs(best.radius - track.radius) ? t : best
  );
}

  );

// Genetic code codon table: DNA codon → 1-letter amino acid code
const CODON_TABLE = {
  'TTT': 'F', 'TTC': 'F', 'TTA': 'L', 'TTG': 'L', 'TCT': 'S', 'TCC': 'S', 'TCA': 'S', 'TCG': 'S',
  'TAT': 'Y', 'TAC': 'Y', 'TAA': '*', 'TAG': '*', 'TGT': 'C', 'TGC': 'C', 'TGA': '*', 'TGG': 'W',
  'CTT': 'L', 'CTC': 'L', 'CTA': 'L', 'CTG': 'L', 'CCT': 'P', 'CCC': 'P', 'CCA': 'P', 'CCG': 'P',
  'CAT': 'H', 'CAC': 'H', 'CAA': 'Q', 'CAG': 'Q', 'CGT': 'R', 'CGC': 'R', 'CGA': 'R', 'CGG': 'R',
  'ATT': 'I', 'ATC': 'I', 'ATA': 'I', 'ATG': 'M', 'ACT': 'T', 'ACC': 'T', 'ACA': 'T', 'ACG': 'T',
  'AAT': 'N', 'AAC': 'N', 'AAA': 'K', 'AAG': 'K', 'AGT': 'S', 'AGC': 'S', 'AGA': 'R', 'AGG': 'R',
  'GTT': 'V', 'GTC': 'V', 'GTA': 'V', 'GTG': 'V', 'GCT': 'A', 'GCC': 'A', 'GCA': 'A', 'GCG': 'A',
  'GAT': 'D', 'GAC': 'D', 'GAA': 'E', 'GAG': 'E', 'GGT': 'G', 'GGC': 'G', 'GGA': 'G', 'GGG': 'G',
};

// Translate DNA sequence to protein (stop at first stop codon)
function translateDNA(seq) {
  const upper = seq.toUpperCase();
  let protein = '';
  for (let i = 0; i + 2 < upper.length; i += 3) {
    const codon = upper.substring(i, i + 3);
    const aa = CODON_TABLE[codon] || 'X';
    protein += aa;
    if (aa === '*') break;
  }
  return protein;
}

// Calculate GC percentage (0-100)
function calcGC(seq) {
  const upper = seq.toUpperCase();
  const gc = (upper.match(/[GC]/g) || []).length;
  const pct = upper.length > 0 ? ((gc / upper.length) * 100).toFixed(1) : '0.0';
  return pct;
}

// Sequence display block with wrapping and position numbers
function SequenceBlock({ sequence, type = 'DNA' }) {
  const wrapped = [];
  const charsPerLine = 60;
  for (let i = 0; i < sequence.length; i += charsPerLine) {
    const start = i + 1;
    const chunk = sequence.substring(i, i + charsPerLine);
    wrapped.push({ start, chunk });
  }

  return (
    <div style={{
      border: `1px solid ${UI.border}`,
      borderRadius: 4,
      overflow: 'auto',
      maxHeight: 160,
      padding: '8px 12px',
      fontFamily: FONT_MONO,
      fontSize: 11,
      lineHeight: 1.6,
      background: UI.surface,
    }}>
      {wrapped.map((line, idx) => (
        <div key={idx} style={{ display: 'flex', gap: 12 }}>
          <span style={{
            userSelect: 'none',
            color: UI.muted,
            minWidth: 40,
            textAlign: 'right',
            flexShrink: 0,
          }}>
            {line.start}
          </span>
          <span style={{ color: UI.ink, wordBreak: 'break-all' }}>
            {line.chunk}
          </span>
        </div>
      ))}
    </div>
  );
}

function FeatureDetail({ feature }) {
  const cat = FEATURE_CATEGORIES[feature.category] || FEATURE_CATEGORIES['Poorly characterized'] || { color: '#9C9C9C', label: 'Unknown' };
  const [seqTab, setSeqTab] = React.useState('DNA');
  const [copied, setCopied] = React.useState(false);

  const locusTag = feature.locus_tag || feature.locusTag || '—';
  const hasSequence = feature.sequence && feature.sequence.length > 0;

  let dnaSeq = '';
  let proteinSeq = '';
  let gc = '0.0';
  let aaLen = 0;

  if (hasSequence) {
    dnaSeq = feature.sequence;
    gc = calcGC(dnaSeq);
    if (feature.type === 'CDS') {
      proteinSeq = translateDNA(dnaSeq);
      aaLen = proteinSeq.replace(/\*/g, '').length;
    }
  }

  const activeSeq = seqTab === 'Protein' ? proteinSeq : dnaSeq;

  const handleCopyFasta = () => {
    try {
      let text = '';
      if (seqTab === 'Protein' && proteinSeq) {
        text = `>${feature.id} ${feature.product}\n${proteinSeq}`;
      } else if (dnaSeq) {
        text = `>${feature.id} ${feature.product}\n${dnaSeq}`;
      } else {
        // Fallback: generate random sequence
        const seqLen = feature.end - feature.start;
        let seq = '';
        const bases = ['A', 'T', 'G', 'C'];
        for (let i = 0; i < seqLen; i++) {
          seq += bases[Math.floor(Math.random() * 4)];
        }
        text = `>${feature.id} ${feature.product}\n${seq}`;
      }

      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    } catch (err) {
      console.warn('Copy failed:', err);
    }
  };

  return (
    <div style={{ padding: 18, overflow: 'auto', height: '100%' }}>
      {/* Header */}
      <div style={{
        fontSize: 10, fontFamily: FONT_MONO, color: UI.muted,
        textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 6,
      }}>
        Feature · {feature.type || 'CDS'}
      </div>
      <div style={{
        fontSize: 20, fontFamily: FONT_MONO, fontWeight: 600, color: UI.ink, marginBottom: 4,
      }}>
        {feature.id}
      </div>
      <div style={{ fontSize: 13, fontFamily: FONT_SANS, color: UI.ink2, lineHeight: 1.45, marginBottom: 16 }}>
        {feature.product}
      </div>

      {/* Metadata section */}
      <div style={{ borderTop: `1px solid ${UI.border}`, paddingTop: 16, marginBottom: 16 }}>
        <DefRow label="Locus tag" value={locusTag} mono />
        <DefRow label="Start"     value={feature.start.toLocaleString() + ' bp'} mono />
        <DefRow label="End"       value={feature.end.toLocaleString() + ' bp'} mono />
        <DefRow label="Length"    value={(feature.end - feature.start).toLocaleString() + ' bp'} mono />
        <DefRow label="Strand"    value={feature.strand > 0 ? 'forward (+)' : 'reverse (−)'} />
        <DefRow label="Category">
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 6,
            fontSize: 12, fontFamily: FONT_SANS,
          }}>
            <span style={{ width: 9, height: 9, borderRadius: 2, background: cat.color }} />
            {feature.category}
          </span>
        </DefRow>
      </div>

      {/* Sequence section */}
      <div style={{ marginTop: 16, borderTop: `1px solid ${UI.border}`, paddingTop: 12 }}>
        <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>
          Sequence
        </div>

        {hasSequence ? (
          <>
            {/* Tabs */}
            <div style={{ display: 'flex', gap: 2, marginBottom: 10 }}>
              <button
                onClick={() => setSeqTab('DNA')}
                style={{
                  padding: '4px 10px',
                  fontSize: 11,
                  fontFamily: FONT_MONO,
                  background: seqTab === 'DNA' ? UI.ink : UI.surface,
                  color: seqTab === 'DNA' ? '#FFF' : UI.ink,
                  border: `1px solid ${UI.border}`,
                  borderRadius: 3,
                  cursor: 'pointer',
                }}
              >
                DNA
              </button>
              {feature.type === 'CDS' && (
                <button
                  onClick={() => setSeqTab('Protein')}
                  style={{
                    padding: '4px 10px',
                    fontSize: 11,
                    fontFamily: FONT_MONO,
                    background: seqTab === 'Protein' ? UI.ink : UI.surface,
                    color: seqTab === 'Protein' ? '#FFF' : UI.ink,
                    border: `1px solid ${UI.border}`,
                    borderRadius: 3,
                    cursor: 'pointer',
                  }}
                >
                  Protein
                </button>
              )}
            </div>

            {/* Sequence display */}
            <SequenceBlock sequence={activeSeq} type={seqTab} />

            {/* Stats bar */}
            <div style={{
              marginTop: 10,
              fontSize: 11,
              fontFamily: FONT_MONO,
              color: UI.muted,
              borderTop: `1px solid ${UI.border}`,
              paddingTop: 8,
            }}>
              {dnaSeq.length} bp · GC {gc}%
              {feature.type === 'CDS' && ` · ${aaLen} aa`}
            </div>

            {/* Copy button */}
            <div style={{ marginTop: 12 }}>
              <button onClick={handleCopyFasta} style={primaryBtn}>
                {copied ? 'Copied!' : 'Copy as FASTA'}
              </button>
            </div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 12, color: UI.muted, fontStyle: 'italic', marginBottom: 12 }}>
              Load a GenBank file to view sequence.
            </div>
            <button onClick={handleCopyFasta} style={primaryBtn}>
              {copied ? 'Copied!' : 'Copy placeholder FASTA'}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ColorsEditor({ paletteTick, onPaletteChange }) {
  const [editingKey, setEditingKey] = React.useState(null);

  const setColor = (key, color) => {
    FEATURE_CATEGORIES[key] = { ...FEATURE_CATEGORIES[key], color };
    onPaletteChange();
  };
  const randomize = () => {
    const pool = [...SCIENTIFIC_SWATCHES];
    Object.keys(FEATURE_CATEGORIES).forEach((k, i) => {
      const c = pool[(i * 3 + Math.floor(Math.random() * pool.length)) % pool.length];
      FEATURE_CATEGORIES[k] = { ...FEATURE_CATEGORIES[k], color: c };
    });
    onPaletteChange();
  };
  const allGray = () => {
    const tones = ['#3A3A3A','#5A5A5A','#7A7A7A','#9A9A9A','#B8B3A4','#C8C3B4','#A8A398','#888378'];
    Object.keys(FEATURE_CATEGORIES).forEach((k, i) => {
      FEATURE_CATEGORIES[k] = { ...FEATURE_CATEGORIES[k], color: tones[i % tones.length] };
    });
    onPaletteChange();
  };

  return (
    <div style={{ padding: 18 }}>
      <div style={{ fontSize: 11.5, fontFamily: FONT_SANS, color: UI.muted, marginBottom: 12, lineHeight: 1.5 }}>
        CDS color comes from functional category. Click a row to pick a new swatch.
      </div>
      {Object.entries(FEATURE_CATEGORIES).map(([key, cat]) => (
        <div key={key} style={{
          padding: '8px 0', borderBottom: `1px solid ${UI.border}`,
        }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer',
          }} onClick={() => setEditingKey(editingKey === key ? null : key)}>
            <div style={{ width: 16, height: 16, borderRadius: 3, background: cat.color, flexShrink: 0,
                          border: `1px solid ${UI.divider}` }} />
            <div style={{ flex: 1, fontSize: 12, fontFamily: FONT_SANS, color: UI.ink }}>
              {cat.label}
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10.5, color: UI.muted }}>
              {cat.color}
            </div>
          </div>
          {editingKey === key && (
            <div style={{ marginTop: 10, paddingLeft: 26 }}>
              <ColorSwatchPicker value={cat.color} onChange={(c) => setColor(key, c)} />
              <div style={{ marginTop: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted }}>HEX</span>
                <input type="text" value={cat.color}
                       onChange={(e) => setColor(key, e.target.value)}
                       style={{ ...inputStyle, width: 90, fontFamily: FONT_MONO, fontSize: 11 }} />
              </div>
            </div>
          )}
        </div>
      ))}
      <div style={{ marginTop: 16, display: 'flex', gap: 6 }}>
        <button style={ghostBtn} onClick={randomize}>Randomize</button>
        <button style={ghostBtn} onClick={allGray}>All gray</button>
      </div>
    </div>
  );
}

// ============================================================
// Labels editor
// ============================================================
function LabelsEditor({ labels, onAddLabel, onRemoveLabel, onClearLabels, genomeLen, availableLabels = [] }) {
  const [search, setSearch] = React.useState('');
  const [showCustom, setShowCustom] = React.useState(false);
  const [pos, setPos] = React.useState('');
  const [name, setName] = React.useState('');
  const [color, setColor] = React.useState('#1A1A1A');
  const [expandedLabelIdx, setExpandedLabelIdx] = React.useState(null);

  const posNum = parseInt(pos, 10);
  const posValid = !isNaN(posNum) && posNum >= 0 && posNum <= genomeLen;

  // Filter available labels by search
  const searchLower = search.toLowerCase();
  const filtered = availableLabels.filter(lbl =>
    lbl.name.toLowerCase().includes(searchLower)
  );

  // Track which labels are already added
  const addedNames = new Set(labels.map(l => l.name));
  const searchResults = filtered.filter(lbl => !addedNames.has(lbl.name)).slice(0, 20);

  return (
    <div style={{ padding: 18 }}>
      <div style={{ fontSize: 11.5, fontFamily: FONT_SANS, color: UI.muted, marginBottom: 14, lineHeight: 1.5 }}>
        Search and add gene labels from your GenBank file, or create custom ones.
      </div>

      {/* Presets */}
      <FieldGroup label="Quick presets">
        <div style={{ display: 'flex', gap: 6 }}>
          <button
            onClick={() => {
              const evenly = availableLabels.length > 0
                ? availableLabels.filter((_, i) => i % Math.max(1, Math.floor(availableLabels.length / 10)) === 0).slice(0, 10)
                : [];
              evenly.forEach(lbl => {
                if (!labels.find(l => l.name === lbl.name)) {
                  onAddLabel({ position: lbl.position, name: lbl.name, color: '#1A1A1A' });
                }
              });
            }}
            style={{ ...primaryBtn, flex: 1, padding: '6px 8px', fontSize: 11 }}
          >
            10 spread
          </button>
          <button
            onClick={() => {
              const sample = availableLabels.length > 0
                ? availableLabels.filter((_, i) => i % Math.max(1, Math.floor(availableLabels.length / 20)) === 0).slice(0, 20)
                : [];
              sample.forEach(lbl => {
                if (!labels.find(l => l.name === lbl.name)) {
                  onAddLabel({ position: lbl.position, name: lbl.name, color: '#1A1A1A' });
                }
              });
            }}
            style={{ ...primaryBtn, flex: 1, padding: '6px 8px', fontSize: 11 }}
          >
            20 spread
          </button>
          <button
            onClick={() => onClearLabels && onClearLabels()}
            style={{ ...ghostBtn, flex: 1, padding: '6px 8px', fontSize: 11 }}
          >
            Clear all
          </button>
        </div>
      </FieldGroup>

      {/* Search bar */}
      <FieldGroup label="Search genes">
        <input
          type="text"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="e.g. dnaA, katG, rpoB"
          style={inputStyle}
        />
      </FieldGroup>

      {/* Search results */}
      {search.trim() && searchResults.length > 0 && (
        <div style={{ marginBottom: 16, padding: '8px 0', borderTop: `1px solid ${UI.border}`, borderBottom: `1px solid ${UI.border}` }}>
          <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 6 }}>
            Found {searchResults.length}
          </div>
          {searchResults.map((lbl, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
              padding: '6px 0', borderBottom: `1px solid ${UI.border}`,
            }}>
              <span style={{ fontSize: 13, fontFamily: FONT_SANS, fontStyle: 'italic', fontWeight: 500, color: UI.ink, flex: 1 }}>
                {lbl.name}
              </span>
              <span style={{ fontSize: 10.5, fontFamily: FONT_MONO, color: UI.muted }}>
                {(lbl.position / 1000).toFixed(0)}k
              </span>
              <button
                onClick={() => {
                  onAddLabel({ position: lbl.position, name: lbl.name, color: '#1A1A1A' });
                  setSearch('');
                }}
                style={{ ...primaryBtn, padding: '4px 10px', fontSize: 11, minWidth: 'auto' }}
              >
                Add
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Current labels */}
      <div style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 6 }}>
          {labels.length} labels selected
        </div>
        <div style={{ maxHeight: 250, overflowY: 'auto' }}>
          {labels.length === 0 ? (
            <div style={{ fontSize: 11, fontFamily: FONT_SANS, color: UI.muted, fontStyle: 'italic', padding: '8px 0' }}>
              Search and add labels above, or create a custom one
            </div>
          ) : (
            labels.map((lbl, i) => (
              <div key={i} style={{ marginBottom: 2 }}>
                <div
                  onClick={() => setExpandedLabelIdx(expandedLabelIdx === i ? null : i)}
                  style={{
                    display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8,
                    padding: '8px 6px', borderBottom: `1px solid ${UI.border}`,
                    cursor: 'pointer', background: expandedLabelIdx === i ? UI.bg : 'transparent',
                    borderRadius: 4,
                  }}
                >
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1 }}>
                    <div style={{
                      width: 12, height: 12, borderRadius: 2,
                      background: lbl.color || '#1A1A1A', border: `1px solid ${UI.border}`,
                    }} />
                    <span style={{ fontSize: 13, fontFamily: FONT_SANS, fontStyle: 'italic', fontWeight: 500, color: UI.ink, flex: 1 }}>
                      {lbl.name}
                    </span>
                  </div>
                  <button onClick={(e) => {
                    e.stopPropagation();
                    onRemoveLabel(i);
                  }} style={{
                    background: 'none', border: 'none', cursor: 'pointer',
                    color: UI.muted, fontSize: 16, padding: 0, lineHeight: 1,
                  }}>×</button>
                </div>
                {expandedLabelIdx === i && (
                  <div style={{ padding: '10px 6px', background: UI.bg, borderRadius: 4, marginBottom: 6, display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {/* Label name */}
                    <div>
                      <label style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, display: 'block', marginBottom: 4 }}>Name</label>
                      <input
                        type="text"
                        value={lbl.name}
                        onChange={(e) => {
                          onRemoveLabel(i);
                          onAddLabel({ ...lbl, name: e.target.value });
                        }}
                        style={{ ...inputStyle, fontSize: 12 }}
                      />
                    </div>

                    {/* Color picker */}
                    <div>
                      <label style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, display: 'block', marginBottom: 4 }}>Color</label>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 6 }}>
                        <ColorSwatchPicker
                          value={lbl.color || '#1A1A1A'}
                          onChange={(newColor) => {
                            onRemoveLabel(i);
                            onAddLabel({ ...lbl, color: newColor });
                          }}
                        />
                      </div>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <input
                          type="text"
                          value={lbl.color || '#1A1A1A'}
                          onChange={(e) => {
                            const newColor = e.target.value;
                            if (/^#[0-9A-F]{6}$/i.test(newColor)) {
                              onRemoveLabel(i);
                              onAddLabel({ ...lbl, color: newColor });
                            }
                          }}
                          placeholder="#1A1A1A"
                          style={{ ...inputStyle, fontSize: 11, fontFamily: FONT_MONO, flex: 1 }}
                        />
                      </div>
                    </div>

                    {/* Bold & Italic */}
                    <div>
                      <label style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, display: 'block', marginBottom: 6 }}>Style</label>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button
                          onClick={() => {
                            onRemoveLabel(i);
                            onAddLabel({ ...lbl, bold: !lbl.bold });
                          }}
                          style={{
                            ...ghostBtn,
                            flex: 1,
                            background: lbl.bold ? '#D4A84A' : 'transparent',
                            color: lbl.bold ? '#1A1A1A' : UI.muted,
                            fontWeight: 'bold',
                            fontSize: 12,
                          }}
                          title="Bold"
                        >
                          B
                        </button>
                        <button
                          onClick={() => {
                            onRemoveLabel(i);
                            onAddLabel({ ...lbl, italic: !lbl.italic });
                          }}
                          style={{
                            ...ghostBtn,
                            flex: 1,
                            background: lbl.italic ? '#D4A84A' : 'transparent',
                            color: lbl.italic ? '#1A1A1A' : UI.muted,
                            fontStyle: 'italic',
                            fontSize: 12,
                          }}
                          title="Italic"
                        >
                          I
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      </div>

      {/* Custom label button (collapsed) */}
      <button
        onClick={() => setShowCustom(!showCustom)}
        style={{ ...ghostBtn, width: '100%', marginBottom: 12, marginTop: 8 }}
      >
        {showCustom ? '▼ Add custom label' : '▶ Add custom label'}
      </button>

      {/* Custom label form (expanded) */}
      {showCustom && (
        <div style={{ padding: '12px 0', borderTop: `1px solid ${UI.border}`, borderBottom: `1px solid ${UI.border}`, marginBottom: 12 }}>
          <FieldGroup label={`Position (bp) · 0 – ${genomeLen.toLocaleString()}`}>
            <input
              type="number"
              value={pos}
              onChange={(e) => setPos(e.target.value)}
              placeholder="e.g. 1471846"
              style={{
                ...inputStyle,
                borderColor: pos && !posValid ? '#B67777' : UI.border,
              }}
            />
          </FieldGroup>
          <FieldGroup label="Label text">
            <input
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="my gene"
              style={inputStyle}
            />
          </FieldGroup>
          <FieldGroup label="Color">
            <ColorSwatchPicker value={color} onChange={setColor} />
          </FieldGroup>
          <div style={{ display: 'flex', gap: 6, marginTop: 12 }}>
            <button
              style={{ ...primaryBtn, opacity: (posValid && name) ? 1 : 0.4, cursor: (posValid && name) ? 'pointer' : 'not-allowed' }}
              disabled={!(posValid && name)}
              onClick={() => {
                onAddLabel({ position: posNum, name, color });
                setPos('');
                setName('');
              }}
            >
              Add custom
            </button>
            <button style={ghostBtn} onClick={() => { setPos(''); setName(''); setShowCustom(false); }}>Cancel</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// Highlights editor
// ============================================================
function HighlightsEditor({ highlights, onAddHighlight, onRemoveHighlight, genomeLen }) {
  const [start, setStart] = React.useState('');
  const [end, setEnd] = React.useState('');
  const [label, setLabel] = React.useState('');
  const [color, setColor] = React.useState('#D4A84A');
  const [opacity, setOpacity] = React.useState(0.18);

  const s = parseInt(start, 10);
  const e = parseInt(end, 10);
  const valid = !isNaN(s) && !isNaN(e) && s >= 0 && e <= genomeLen && s < e && label.trim().length > 0;

  return (
    <div style={{ padding: 18 }}>
      <div style={{ fontSize: 11.5, fontFamily: FONT_SANS, color: UI.muted, marginBottom: 16, lineHeight: 1.5 }}>
        Translucent wedges behind all tracks. Useful for marking pathogenicity islands, prophages, or regions of interest.
      </div>

      <FieldGroup label="Region name">
        <input type="text" value={label} onChange={(e) => setLabel(e.target.value)}
               placeholder="e.g. RD1 / ESX-1 locus" style={inputStyle} />
      </FieldGroup>

      <div style={{ display: 'flex', gap: 8 }}>
        <div style={{ flex: 1 }}>
          <FieldGroup label="Start (bp)">
            <input type="number" value={start} onChange={(e) => setStart(e.target.value)}
                   placeholder="0" style={inputStyle} />
          </FieldGroup>
        </div>
        <div style={{ flex: 1 }}>
          <FieldGroup label="End (bp)">
            <input type="number" value={end} onChange={(e) => setEnd(e.target.value)}
                   placeholder={genomeLen.toString()} style={inputStyle} />
          </FieldGroup>
        </div>
      </div>

      <FieldGroup label="Color">
        <ColorSwatchPicker value={color} onChange={setColor} />
      </FieldGroup>

      <FieldGroup label={`Opacity · ${Math.round(opacity * 100)}%`}>
        <input type="range" min={0.05} max={0.5} step={0.01} value={opacity}
               onChange={(e) => setOpacity(parseFloat(e.target.value))}
               style={sliderStyle} />
      </FieldGroup>

      <div style={{ display: 'flex', gap: 6, marginTop: 10, marginBottom: 8 }}>
        <button
          style={{ ...primaryBtn, opacity: valid ? 1 : 0.4, cursor: valid ? 'pointer' : 'not-allowed' }}
          disabled={!valid}
          onClick={() => {
            onAddHighlight({ start: s, end: e, color, opacity, label: label.trim() });
            setStart(''); setEnd(''); setLabel('');
          }}>+ Add highlight region</button>
      </div>
      {!valid && (start || end || label) && (
        <div style={{ fontSize: 10.5, fontFamily: FONT_MONO, color: '#B67777', marginBottom: 10 }}>
          {label.trim().length === 0 ? 'Name required · ' : ''}
          {isNaN(s) || isNaN(e) ? 'Numeric positions required · ' : ''}
          {!isNaN(s) && !isNaN(e) && s >= e ? 'Start must be < End · ' : ''}
          {!isNaN(e) && e > genomeLen ? `End exceeds ${genomeLen.toLocaleString()} · ` : ''}
        </div>
      )}

      <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: UI.muted, textTransform: 'uppercase', letterSpacing: 0.4, marginBottom: 6 }}>
          {highlights.length} region{highlights.length === 1 ? '' : 's'}
        </div>
        {highlights.map((h, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '8px 0', borderBottom: `1px solid ${UI.border}`,
          }}>
            <div style={{ width: 16, height: 16, borderRadius: 3, background: h.color, opacity: 0.6 }} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, fontFamily: FONT_SANS, color: UI.ink }}>{h.label}</div>
              <div style={{ fontSize: 10.5, fontFamily: FONT_MONO, color: UI.muted }}>
                {h.start.toLocaleString()} – {h.end.toLocaleString()}
              </div>
            </div>
            <button onClick={() => onRemoveHighlight(i)} style={{
              background: 'none', border: 'none', cursor: 'pointer',
              color: UI.muted, fontSize: 16, padding: 0,
            }}>×</button>
          </div>
        ))}
        {highlights.length === 0 && (
          <div style={{ fontSize: 12, color: UI.mutedLite, fontStyle: 'italic', marginTop: 8 }}>
            No highlights yet.
          </div>
        )}
      </div>
    </div>
  );
}

    Legend: true, 'Title block': true, 'Scale bar': true, 'GC statistics': false,

    if (typeof onExport === 'function') {
      onExport({ format, figureTarget, resolution, includes });
    }
  };

  return (
    <div style={{ padding: 18 }}>
      <div style={{ fontSize: 11.5, fontFamily: FONT_SANS, color: UI.muted, marginBottom: 16, lineHeight: 1.5 }}>
        Vector SVG is recommended for publication — crisp at any size.
      </div>

      <FieldGroup label="Figure">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>

            { id: 'circular', label: 'Circular' },
            { id: 'linear',   label: 'Linear' },
            { id: 'synteny',  label: 'Synteny' },
          ].map(o => (
            <button key={o.id} onClick={() => setFigureTarget(o.id)}
              style={{
                ...ghostBtn, padding: '8px 6px', fontSize: 11,
                background: figureTarget === o.id ? UI.ink : 'transparent',
                color: figureTarget === o.id ? UI.bg : UI.ink,
                borderColor: figureTarget === o.id ? UI.ink : UI.divider,
              }}>{o.label}</button>
          ))}
        </div>
      </FieldGroup>

      <FieldGroup label={`Resolution · ${resolution} DPI`}>
        <input type="range" min="72" max="900" step="12"
               value={resolution} onChange={(e) => onResolution(parseInt(e.target.value, 10))}
               style={sliderStyle} />
        <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: FONT_MONO, fontSize: 10, color: UI.muted, marginTop: 2 }}>
          <span>screen</span><span>print</span><span>journal</span>
        </div>
      </FieldGroup>

      <FieldGroup label="Format">
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
          {['SVG','PNG','PDF','TIFF'].map(f => (
            <button key={f} onClick={() => setFormat(f)}
              style={{
                ...ghostBtn, padding: '10px',
                fontFamily: FONT_MONO, fontSize: 11,
                background: format === f ? UI.accent : 'transparent',
                color: format === f ? UI.bg : UI.ink,
                borderColor: format === f ? UI.accent : UI.divider,
              }}>{f}</button>
          ))}
        </div>
      </FieldGroup>

      <FieldGroup label="Include">
        {['Legend', 'Title block', 'Scale bar', 'GC statistics'].map(opt => (
          <label key={opt} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', fontSize: 12, fontFamily: FONT_SANS, color: UI.ink, cursor: 'pointer' }}>
            <input type="checkbox" checked={!!includes[opt]}
                   onChange={(e) => setIncludes(x => ({ ...x, [opt]: e.target.checked }))}
                   style={{ accentColor: UI.accent }} />
            {opt}
          </label>
        ))}
      </FieldGroup>

      <button style={{ ...primaryBtn, width: '100%', padding: '12px' }} onClick={run}>
        Render figure · {format}
      </button>
      <div style={{ fontSize: 10.5, fontFamily: FONT_MONO, color: UI.muted, textAlign: 'center', marginTop: 8 }}>
        {figureTarget === 'current' ? (viewMode + ' (current)') :
         figureTarget === 'all3' ? 'all 3 views' : figureTarget}
         {' · '}{resolution} DPI
      </div>
    </div>
  );
}

// ============================================================
// Synteny editor — colors, midline, rename genomes, per-genome labels + highlights
// ============================================================
function SyntenyEditor({
  config, onConfigChange,
  genomes, selectedGenomeId, onSelectGenome, onRenameGenome,
  syntenyLabels, onAddSyntenyLabel, onRemoveSyntenyLabel,
  syntenyHighlights, onAddSyntenyHighlight, onRemoveSyntenyHighlight,
  genomeLen,
}) {
  const gid = selectedGenomeId || (genomes[0] && genomes[0].id);
  const g = genomes.find(x => x.id === gid);
  const [section, setSection] = React.useState('Ribbons');
  const labels = syntenyLabels[gid] || [];
  const highlights = syntenyHighlights[gid] || [];

  return (
    <div style={{ padding: 0 }}>
      {/* Sub-tab strip */}
      <div style={{ display: 'flex', borderBottom: `1px solid ${UI.border}` }}>
        {['Ribbons','Midline','Genomes','Labels','Highlights'].map(s => (
          <button key={s} onClick={() => setSection(s)}
            style={{
              flex: 1, padding: '8px 2px',
              fontSize: 10.5, fontFamily: FONT_MONO,
              background: section === s ? UI.bg : 'transparent',
              border: 'none',
              borderBottom: section === s ? `2px solid ${UI.ink}` : '2px solid transparent',
              color: section === s ? UI.ink : UI.muted,
              cursor: 'pointer',
              textTransform: 'uppercase', letterSpacing: 0.3,
            }}>{s}</button>
        ))}
      </div>

      <div style={{ padding: 18 }}>
        {section === 'Ribbons' && <RibbonColorsEditor config={config} onChange={onConfigChange} />}
        {section === 'Midline' && <MidlineEditor config={config} onChange={onConfigChange} />}
        {section === 'Genomes' && (
          <GenomesRenameEditor genomes={genomes} onRename={onRenameGenome} />
        )}
        {section === 'Labels' && (
          <PerGenomeLabelsEditor
            genomes={genomes} gid={gid} onSelectGenome={onSelectGenome}
            labels={labels} onAdd={(lbl) => onAddSyntenyLabel(gid, lbl)}
            onRemove={(idx) => onRemoveSyntenyLabel(gid, idx)}
            genomeLen={genomeLen}

  );
}

// genbank-parser.jsx
// ============================================================

// Minimal GenBank parser + Open-file handler.
// Handles: LOCUS (length), ACCESSION, DEFINITION, FEATURES/gene/CDS with
// /gene, /product, /locus_tag qualifiers. Strand via complement().

function parseGenBank(text) {
  const lines = text.split(/\r?\n/);
  let genomeLen = 0;
  let accession = '';
  let definition = '';
  const features = [];
  const gLabels = [];  // candidate gene labels

  // Parse header
  for (let i = 0; i < Math.min(lines.length, 30); i++) {
    const ln = lines[i];
    if (ln.startsWith('LOCUS')) {
      const m = ln.match(/(\d+)\s+bp/);
      if (m) genomeLen = parseInt(m[1], 10);
    } else if (ln.startsWith('ACCESSION')) {
      accession = ln.replace('ACCESSION', '').trim().split(/\s+/)[0];
    } else if (ln.startsWith('DEFINITION')) {
      definition = ln.replace('DEFINITION', '').trim();
    }
  }

  // Find FEATURES section
  let inFeatures = false;
  let current = null;
  const flush = () => {
    if (!current) return;
    if (current.type === 'gene' || current.type === 'CDS') {
      features.push(current);
      // Only create labels for CDS features (avoid duplicates from gene+CDS pairs)
      if (current.type === 'CDS') {
        const labelName = current.gene || current.product;
        if (labelName) {
          gLabels.push({ position: Math.floor((current.start + current.end) / 2), name: labelName });
        }
      }
    }
    current = null;
  };

  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (ln.startsWith('FEATURES')) { inFeatures = true; continue; }
    if (!inFeatures) continue;
    if (ln.startsWith('ORIGIN') || ln.startsWith('BASE COUNT') || ln.startsWith('//')) {
      flush(); break;
    }

    // Feature key lines start at col 6 with non-space
    if (/^     \S/.test(ln)) {
      flush();
      const m = ln.match(/^     (\S+)\s+(.+)$/);
      if (!m) continue;
      const type = m[1];
      let loc = m[2].trim();
      // collect continuation lines of location
      while (i + 1 < lines.length && /^ {21}(?!\/)/.test(lines[i + 1])
             && !/^     \S/.test(lines[i + 1])) {
        loc += lines[++i].trim();
      }
      const inverted = /complement/.test(loc);
      const nums = [...loc.matchAll(/(\d+)/g)].map(x => parseInt(x[1], 10));
      if (nums.length < 2) { current = null; continue; }
      const start = Math.min(...nums);
      const end = Math.max(...nums);
      current = {
        type, start, end, strand: inverted ? -1 : 1,
        id: `${type}_${start}`, gene: '', product: '', locusTag: '',
        category: 'Function unknown',
      };
      continue;
    }

    // Qualifier lines /key=value
    if (/^ {21}\//.test(ln) && current) {
      const m = ln.trim().match(/^\/(\w+)=?"?(.*)"?$/);
      if (!m) continue;
      const key = m[1];
      let val = m[2].replace(/"$/, '').replace(/^"/, '');
      // consume continuation lines
      while (i + 1 < lines.length && /^ {21}[^\/]/.test(lines[i + 1])) {
        val += ' ' + lines[++i].trim().replace(/"$/, '');
      }
      if (key === 'gene')        current.gene = val;
      else if (key === 'locus_tag') current.locusTag = val;
      else if (key === 'product') {
        current.product = val;
        // Rough category inference
        const v = val.toLowerCase();
        if (/ribosom|rna|trna|transfer/.test(v))                   current.category = 'Information storage';
        else if (/transport|permease|abc |channel|efflux/.test(v)) current.category = 'Cellular processes';
        else if (/synthase|reductase|dehydrogenase|kinase|ase$/.test(v)) current.category = 'Metabolism';
        else if (/hypothetical|unknown/.test(v))                   current.category = 'Hypothetical';
        else                                                       current.category = 'Poorly characterized';
      }
    }
  }
  flush();

  if (!genomeLen) {
    // Fall back to max end
    genomeLen = Math.max(0, ...features.map(f => f.end));
  }

  // Extract SEQUENCE section
  let fullSequence = '';
  let inSequence = false;
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (ln.startsWith('ORIGIN')) { inSequence = true; continue; }
    if (!inSequence) continue;
    if (ln.startsWith('//')) break;
    // Remove line numbers and whitespace from sequence lines
    const seq = ln.replace(/^\s*\d+\s+/, '').replace(/\s+/g, '');
    fullSequence += seq;
  }

  // Add sequence to each feature
  features.forEach((f, i) => {
    // Create unique ID: display name + random ID to handle duplicates
    const displayId = f.locusTag || f.gene || `F${i}`;
    const uniqueSuffix = Math.random().toString(36).substr(2, 9);
    f.uniqueId = `${displayId}-${uniqueSuffix}`;
    f.id = displayId; // Keep original for display
    // GenBank uses 1-based indexing, convert to 0-based
    const seqStart = Math.max(0, f.start - 1);
    const seqEnd = Math.min(fullSequence.length, f.end);
    if (fullSequence && seqStart < fullSequence.length) {
      let featureSeq = fullSequence.substring(seqStart, seqEnd);
      // Reverse complement if on reverse strand
      if (f.strand < 0) {
        featureSeq = reverseComplement(featureSeq);
      }
      f.sequence = featureSeq;
    }
  });

  return { genomeLen, accession, definition, features, labels: gLabels, fullSequence };
}

// Helper function to reverse complement DNA
function reverseComplement(seq) {
  const complement = { 'a': 't', 't': 'a', 'g': 'c', 'c': 'g', 'n': 'n' };
  return seq.toLowerCase().split('').reverse().map(b => complement[b] || b).join('');
}

// Calculate GC content across genome in windows
function calculateGCContent(sequence, windowCount = 360) {
  const windowSize = Math.floor(sequence.length / windowCount);
  const values = [];
  for (let i = 0; i < windowCount; i++) {
    const start = i * windowSize;
    const end = Math.min(start + windowSize, sequence.length);
    const window = sequence.substring(start, end).toLowerCase();
    const gc = (window.match(/[gc]/g) || []).length;
    values.push(windowSize > 0 ? gc / windowSize : 0.5);
  }
  return values;
}

// Calculate GC skew (G-C)/(G+C) across genome in windows
function calculateGCSkew(sequence, windowCount = 360) {
  const windowSize = Math.floor(sequence.length / windowCount);
  const values = [];
  for (let i = 0; i < windowCount; i++) {
    const start = i * windowSize;
    const end = Math.min(start + windowSize, sequence.length);
    const window = sequence.substring(start, end).toLowerCase();
    const gCount = (window.match(/g/g) || []).length;
    const cCount = (window.match(/c/g) || []).length;
    const total = gCount + cCount;
    values.push(total > 0 ? (gCount - cCount) / total : 0);
  }
  return values;
}

// File picker — opens a dialog and loads a .gb/.gbk/.genbank file.
// On success, mutates the global data so the app re-renders.
function openGenBank(setLabels, setTracks, setAvailableLabels) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.gb,.gbk,.genbank,.txt,text/plain';
  input.onchange = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = parseGenBank(text);
      if (!parsed.genomeLen || parsed.features.length === 0) {
        alert('Could not parse this GenBank file — no LOCUS length or features found.');
        return;
      }
      // Update the global window-scoped data so all views pick it up
      window.GENOME_LENGTH = parsed.genomeLen;
      window.GENOME_ACCESSION = parsed.accession || file.name;
      window.GENOME_NAME = parsed.definition
        ? parsed.definition.split(',')[0].slice(0, 60)
        : file.name.replace(/\.(gb|gbk|genbank|txt)$/i, '');

      // Namespace GenBank features so they don't conflict with imported tracks
      const genbankId = `t-gb-${Date.now()}`;
      const existingFeats = window.FEATURES || [];
      parsed.features.forEach(f => {
        f.id = `${genbankId}-${f.id}`;
        existingFeats.push(f);
      });
      window.FEATURES = existingFeats;

      // Set available labels from the GenBank file; clear displayed labels so user chooses
      window.GENBANK_LABELS = parsed.labels;
      setAvailableLabels(parsed.labels);
      setLabels([]);

      // Calculate GC content and skew from the loaded sequence
      if (parsed.fullSequence) {
        window.GENOME_SEQUENCE = parsed.fullSequence;
        window.GC_CONTENT = calculateGCContent(parsed.fullSequence);
        window.GC_SKEW = calculateGCSkew(parsed.fullSequence);
      }

      // Create forward/reverse tracks for GenBank features
      setTracks(ts => {
        const maxR = Math.max(...ts.map(t => t.radius));
        const gbName = file.name.replace(/\.(gb|gbk|genbank|txt)$/i, '');

        // Check if we have both strands
        const hasForward = parsed.features.some(f => f.strand > 0);
        const hasReverse = parsed.features.some(f => f.strand < 0);

        const fwdTrack = hasForward ? {
          id: `${genbankId}-fwd`,
          name: `GenBank · ${gbName} (forward)`,
          type: 'cds',
          visible: true,
          radius: Math.min(0.92, maxR + 0.04),
          thickness: 0.03,
          strand: 1,
          colorBy: 'category',
          userImported: true,
        } : null;

        const revTrack = hasReverse ? {
          id: `${genbankId}-rev`,
          name: `GenBank · ${gbName} (reverse)`,
          type: 'cds',
          visible: true,
          radius: Math.min(0.96, maxR + 0.08),
          thickness: 0.03,
          strand: -1,
          colorBy: 'category',
          userImported: true,
        } : null;

        // Delete default demo CDS tracks
        const newTs = ts.filter(t => !((t.id === 't-cds-fwd' || t.id === 't-cds-rev') && !t.userImported));

        if (fwdTrack) newTs.push(fwdTrack);
        if (revTrack) newTs.push(revTrack);

        return newTs;
      });
      // Friendly confirmation
      console.info('Loaded', parsed.features.length, 'features from', file.name);
      // Force full-app refresh by reloading the dataset reference
      window.dispatchEvent(new Event('gyre-data-loaded'));
    } catch (e) {
      console.error(e);
      alert('Failed to read GenBank file: ' + e.message);
    }
  };
  input.click();
}

// Generate synteny data from BLAST results between adjacent genomes
// Takes array of {name, length, segments} and creates synteny pairs
function generateSyntenyFromBlast(genomes) {
  if (genomes.length < 2) return [];

  const synteny = [];
  for (let i = 0; i < genomes.length - 1; i++) {
    const genomeA = genomes[i];
    const genomeB = genomes[i + 1];
    const segsA = genomeA.segments || [];
    const segsB = genomeB.segments || [];

    // Create pairs from BLAST segments
    // Simple approach: match segments by approximate position
    const pairs = [];

    for (const segA of segsA) {
      // Find overlapping segment in B (rough match by position ratio)
      const ratioA = (segA.start + segA.end) / 2 / Math.max(1, genomeA.length);
      for (const segB of segsB) {
        const ratioB = (segB.start + segB.end) / 2 / Math.max(1, genomeB.length);
        // If positions are similar (within 20%), create a pair
        if (Math.abs(ratioA - ratioB) < 0.2) {
          pairs.push({
            a: [segA.start, segA.end],
            b: [segB.start, segB.end],
            identity: Math.min(segA.identity, segB.identity),
            inverted: false, // TODO: detect inversions from strand info
          });
          break;
        }
      }
    }

    if (pairs.length > 0) {
      synteny.push({
        from: i,
        to: i + 1,
        pairs,
      });
    }
  }

  return synteny;
}

Object.assign(window, { parseGenBank, openGenBank, generateSyntenyFromBlast, reverseComplement });


// ============================================================
// track-importers.jsx
// ============================================================

// track-importers.jsx
// Parsers + file pickers for BED / GFF3 (feature tracks) and bedGraph
// (quantitative tracks). These create real tracks and push them into the
// rendering pipeline — no placeholders.

// ------------------------------------------------------------
// BED parser (3–6 cols): chrom  start  end  [name]  [score]  [strand]
// ------------------------------------------------------------
function parseBED(text) {
  const features = [];
  let firstChrom = null;
  let maxEnd = 0;
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith('#') || line.startsWith('track ') || line.startsWith('browser ')) continue;
    const cols = line.split(/\t/);
    if (cols.length < 3) continue;
    const chrom = cols[0];
    const start = parseInt(cols[1], 10);
    const end = parseInt(cols[2], 10);
    if (isNaN(start) || isNaN(end)) continue;
    firstChrom = firstChrom || chrom;
    if (chrom !== firstChrom) continue;     // stick to first contig
    maxEnd = Math.max(maxEnd, end);
    const name = cols[3] || `feat_${features.length}`;
    const strand = cols[5] === '-' ? -1 : 1;
    features.push({
      id: `bed-${features.length}`,
      start, end,
      strand,
      product: name,
      gene: name,
      category: 'Poorly characterized',
    });
  }
  return { features, chrom: firstChrom, length: maxEnd };
}

// ------------------------------------------------------------
// GFF3 parser (9 cols): seqid source type start end score strand phase attrs
// We import type in {gene, CDS, mRNA, tRNA, rRNA, ncRNA}.
// attrs are semicolon-separated key=value pairs.
// ------------------------------------------------------------
function parseGFF3(text) {
  const features = [];
  let firstChrom = null;
  let maxEnd = 0;
  const wanted = new Set(['gene', 'CDS', 'mRNA', 'tRNA', 'rRNA', 'ncRNA']);
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith('#')) continue;
    const cols = line.split(/\t/);
    if (cols.length < 8) continue;
    const type = cols[2];
    if (!wanted.has(type)) continue;
    const chrom = cols[0];
    const start = parseInt(cols[3], 10) - 1; // GFF is 1-based inclusive → convert to 0-based
    const end = parseInt(cols[4], 10);
    if (isNaN(start) || isNaN(end)) continue;
    firstChrom = firstChrom || chrom;
    if (chrom !== firstChrom) continue;
    maxEnd = Math.max(maxEnd, end);
    const strand = cols[6] === '-' ? -1 : 1;
    const attrs = Object.fromEntries(
      (cols[8] || '').split(';').filter(Boolean).map(kv => {
        const [k, ...v] = kv.split('=');
        return [k && k.trim(), decodeURIComponent((v.join('=') || '').trim())];
      }).filter(([k, v]) => k && v != null)
    );
    const name = attrs.Name || attrs.gene || attrs.locus_tag || attrs.ID || `feat_${features.length}`;
    features.push({
      id: `gff-${features.length}`,
      start, end,
      strand,
      product: attrs.product || name,
      gene: name,
      category: categorizeGffType(type),
    });
  }
  return { features, chrom: firstChrom, length: maxEnd };
}

function categorizeGffType(type) {
  if (type === 'CDS' || type === 'gene' || type === 'mRNA') return 'Information storage';
  if (type === 'tRNA' || type === 'rRNA' || type === 'ncRNA') return 'RNA';
  return 'Poorly characterized';
}

// ------------------------------------------------------------
// bedGraph parser: chrom  start  end  value
// ------------------------------------------------------------
function parseBedGraph(text) {
  const bins = [];
  let firstChrom = null;
  let maxEnd = 0;
  for (const rawLine of text.split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line || line.startsWith('#') || line.startsWith('track ') || line.startsWith('browser ')) continue;
    const cols = line.split(/\s+/);
    if (cols.length < 4) continue;
    const chrom = cols[0];
    const start = parseInt(cols[1], 10);
    const end = parseInt(cols[2], 10);
    const val = parseFloat(cols[3]);
    if (isNaN(start) || isNaN(end) || isNaN(val)) continue;
    firstChrom = firstChrom || chrom;
    if (chrom !== firstChrom) continue;
    maxEnd = Math.max(maxEnd, end);
    bins.push({ start, end, value: val });
  }
  return { bins, chrom: firstChrom, length: maxEnd };
}

// ------------------------------------------------------------
// Importer — shared file picker + dispatcher for feature tracks
// ------------------------------------------------------------
function importFeatureTrack(setTracks) {
  pickFile('.bed,.gff,.gff3,.tsv,.txt,text/plain', async (file) => {
    const text = await file.text();
    const isGff = /\.gff3?$/i.test(file.name) || text.startsWith('##gff-version');
    const parsed = isGff ? parseGFF3(text) : parseBED(text);

    if (parsed.features.length === 0) {
      alert('No features found. Expected BED (chrom/start/end/…) or GFF3 (9 columns).');
      return;
    }

    // Adopt genome length if not already larger
    if (parsed.length > window.GENOME_LENGTH) {
      window.GENOME_LENGTH = parsed.length;
    }

    // Assign category color based on name heuristics if missing
    const existingFeats = window.FEATURES || [];
    const trackId = `t-user-${Date.now()}`;

    // Append features to the global features list so they render in circular/linear views
    parsed.features.forEach(f => {
      f.id = `${trackId}-${f.id}`;  // namespaced
      existingFeats.push(f);
    });
    window.FEATURES = existingFeats;

    // Add new tracks: one for forward strand, one for reverse strand (like default CDS tracks)
    setTracks(ts => {
      const maxR = Math.max(...ts.map(t => t.radius));
      const name = file.name.replace(/\.(bed|gff3?|tsv|txt)$/i, '');

      // Check if we have both strands in the data
      const hasForward = parsed.features.some(f => f.strand > 0);
      const hasReverse = parsed.features.some(f => f.strand < 0);

      // Create forward track if needed
      const fwdTrack = hasForward ? {
        id: `${trackId}-fwd`,
        name: `Imported · ${name} (forward)`,
        type: 'cds',
        visible: true,
        radius: Math.min(0.92, maxR + 0.04),
        thickness: 0.03,
        strand: 1,
        colorBy: 'category',
        userImported: true,
      } : null;

      // Create reverse track if needed
      const revTrack = hasReverse ? {
        id: `${trackId}-rev`,
        name: `Imported · ${name} (reverse)`,
        type: 'cds',
        visible: true,
        radius: Math.min(0.96, maxR + 0.08),
        thickness: 0.03,
        strand: -1,
        colorBy: 'category',
        userImported: true,
      } : null;

      // Remove default demo CDS tracks when importing real data
      const newTs = ts.filter(t => !((t.id === 't-cds-fwd' || t.id === 't-cds-rev') && !t.userImported));

      // Add the new tracks
      if (fwdTrack) newTs.push(fwdTrack);
      if (revTrack) newTs.push(revTrack);

      return newTs;
    });

    // Nudge other views to pick up new features
    window.dispatchEvent(new Event('gyre-data-loaded'));
    console.info(`[gyre] imported ${parsed.features.length} features from ${file.name}`);
  });
}

function importBedGraph(setTracks) {
  pickFile('.bedgraph,.bg,.bdg,.txt,text/plain', async (file) => {
    const text = await file.text();
    const parsed = parseBedGraph(text);
    if (parsed.bins.length === 0) {
      alert('No bedGraph bins found. Expected four tab-separated columns: chrom  start  end  value');
      return;
    }

    // Adopt genome length if not already larger
    const genomeLen = Math.max(parsed.length, window.GENOME_LENGTH);
    window.GENOME_LENGTH = genomeLen;

    // Normalize to [0,1] so it renders sanely in both circular and linear
    const vals = parsed.bins.map(b => b.value);
    const vMin = Math.min(...vals);
    const vMax = Math.max(...vals);
    const rng = vMax - vMin || 1;

    // Build a coverage-style array at roughly 500 windows — reuse coverage track style
    const N_WINDOWS = 500;
    const perWin = genomeLen / N_WINDOWS;
    const arr = new Array(N_WINDOWS).fill(0);
    for (const b of parsed.bins) {
      const i0 = Math.floor(b.start / perWin);
      const i1 = Math.min(N_WINDOWS - 1, Math.floor((b.end - 1) / perWin));
      for (let i = i0; i <= i1; i++) {
        arr[i] = Math.max(arr[i], (b.value - vMin) / rng);
      }
    }

    // Store the bedGraph data on window under a stable key so tracks can look it up
    window.USER_BEDGRAPHS = window.USER_BEDGRAPHS || {};
    const trackId = `t-bg-${Date.now()}`;
    window.USER_BEDGRAPHS[trackId] = { values: arr, rawMin: vMin, rawMax: vMax };

    setTracks(ts => {
      const maxR = Math.max(...ts.map(t => t.radius));
      const name = file.name.replace(/\.(bedgraph|bg|bdg|txt)$/i, '');
      const newTrack = {
        id: trackId,
        name: `BedGraph · ${name}`,
        type: 'bedgraph',
        visible: true,
        radius: Math.min(0.88, maxR + 0.04),
        thickness: 0.05,
        color: '#2B5F6B',
        userImported: true,
      };
      return [...ts, newTrack];
    });

    window.dispatchEvent(new Event('gyre-data-loaded'));
    console.info(`[gyre] imported ${parsed.bins.length} bedGraph bins (${vMin.toFixed(2)}–${vMax.toFixed(2)}) from ${file.name}`);
  });
}

// Shared file picker
function pickFile(accept, cb) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try { await cb(f); } catch (err) {
      console.error(err);
      alert('Failed to import ' + f.name + ': ' + err.message);
    }
  };
  input.click();
}

Object.assign(window, {
  parseBED, parseGFF3, parseBedGraph,
  importFeatureTrack, importBedGraph,
});
