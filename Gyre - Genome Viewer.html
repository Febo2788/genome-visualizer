// Sample genome data — Mycobacterium tuberculosis H37Rv-ish subset, fabricated but biologically plausible
// Used to populate the viewer with real-feeling tracks.

const GENOME_LENGTH = 4411532;
const GENOME_NAME = "M. tuberculosis H37Rv";
const GENOME_ACCESSION = "NC_000962.3";

// Feature categories with bright, vibrant colors for better visibility
const FEATURE_CATEGORIES = {
  "Information storage":    { color: "#0066FF", label: "Information storage & processing" },
  "Cellular processes":     { color: "#00CC44", label: "Cellular processes & signaling" },
  "Metabolism":             { color: "#FF6600", label: "Metabolism" },
  "Poorly characterized":   { color: "#999999", label: "Poorly characterized" },
  "Mobile elements":        { color: "#FF3333", label: "Mobile elements" },
  "RNA":                    { color: "#9933FF", label: "RNA (tRNA / rRNA / ncRNA)" },
  "Regulatory":             { color: "#FFCC00", label: "Regulatory" },
  "Hypothetical":           { color: "#00CCCC", label: "Hypothetical" },
};

// Deterministic PRNG so layout is stable between reloads
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Generate ~400 CDS features spread around the genome
function generateFeatures() {
  const rnd = mulberry32(42);
  const cats = Object.keys(FEATURE_CATEGORIES);
  const features = [];
  let pos = 2000;
  let idx = 1;
  while (pos < GENOME_LENGTH - 3000) {
    const length = 300 + Math.floor(rnd() * 2400);
    const strand = rnd() > 0.48 ? 1 : -1;
    // weight category assignment roughly like real bacteria
    const r = rnd();
    let cat;
    if (r < 0.32) cat = "Metabolism";
    else if (r < 0.52) cat = "Poorly characterized";
    else if (r < 0.66) cat = "Cellular processes";
    else if (r < 0.78) cat = "Information storage";
    else if (r < 0.86) cat = "Hypothetical";
    else if (r < 0.92) cat = "Mobile elements";
    else if (r < 0.97) cat = "RNA";
    else cat = "Regulatory";

    // Generate gene name from category or use locus tag
    const geneNames = {
      "Information storage": ["dnaA", "dnaB", "dnaC", "dnaG", "dnaX", "dnaN", "dnaE", "polA", "gyrA", "gyrB", "topA", "rpoA", "rpoB", "rpoC", "rpoD"],
      "Cellular processes": ["ftsA", "ftsK", "ftsZ", "divIB", "divIC", "divJ", "mraY", "murC", "murD", "murE", "murF", "murG"],
      "Metabolism": ["aceA", "aceB", "acoA", "acoB", "acoC", "acpP", "adhA", "adhE", "aldA", "araA", "araB", "araC"],
      "Poorly characterized": ["ORF", "conserved", "predicted", "unknown", "putative", "hypothetical"],
      "Regulatory": ["crp", "dam", "dcm", "fis", "hfq", "leuO", "tyrR"],
      "Mobile elements": ["IS", "transposase", "integrase"],
      "RNA": ["trnA", "trnB", "trnC", "rrnA", "rrnB", "rrnC"],
      "Hypothetical": ["unk", "hyp", "putative"],
    };
    const genePool = geneNames[cat] || ["gene"];
    const geneName = genePool[Math.floor(rnd() * genePool.length)] + idx;

    features.push({
      id: `Rv${String(idx).padStart(4, '0')}${rnd() > 0.8 ? 'c' : ''}`,
      start: pos,
      end: pos + length,
      strand,
      category: cat,
      gene: geneName,
      product: productForCat(cat, rnd),
      locus_tag: `Rv${String(idx).padStart(4, '0')}`,
    });
    pos += length + Math.floor(rnd() * 400) + 20;
    idx++;
  }
  return features;
}

function productForCat(cat, rnd) {
  const pools = {
    "Information storage": ["DNA polymerase III subunit alpha", "50S ribosomal protein L2", "RNA polymerase sigma factor SigA", "DNA gyrase subunit B", "transcription elongation factor NusA"],
    "Cellular processes": ["cell division protein FtsZ", "chaperone protein DnaK", "ATP synthase subunit beta", "penicillin-binding protein", "two-component sensor histidine kinase"],
    "Metabolism": ["acyl-CoA dehydrogenase", "isocitrate dehydrogenase", "phosphoenolpyruvate carboxylase", "aconitate hydratase", "pyruvate kinase", "mycolic acid synthase"],
    "Poorly characterized": ["conserved hypothetical protein", "uncharacterized membrane protein", "PPE family protein", "PE family protein"],
    "Mobile elements": ["IS1081 transposase", "IS6110 transposase", "phage integrase family protein", "mobile genetic element"],
    "RNA": ["tRNA-Ala", "tRNA-Leu", "23S ribosomal RNA", "16S ribosomal RNA", "ncRNA Mcr7"],
    "Regulatory": ["transcriptional regulator WhiB3", "TetR family regulator", "response regulator transcription factor"],
    "Hypothetical": ["hypothetical protein", "hypothetical protein, conserved"],
  };
  const p = pools[cat] || pools["Hypothetical"];
  return p[Math.floor(rnd() * p.length)];
}

const FEATURES = generateFeatures();

// GC content — compute smooth pseudo-signal
function generateGCContent(windowCount = 360) {
  const rnd = mulberry32(7);
  const values = [];
  let v = 0.655;
  for (let i = 0; i < windowCount; i++) {
    v += (rnd() - 0.5) * 0.012;
    // Mycobacterium is GC-rich (~65%)
    v = Math.max(0.58, Math.min(0.72, v));
    values.push(v);
  }
  return values;
}

// GC skew — oscillates, with inflection near origin/terminus
function generateGCSkew(windowCount = 360) {
  const rnd = mulberry32(99);
  const values = [];
  for (let i = 0; i < windowCount; i++) {
    const theta = (i / windowCount) * Math.PI * 2;
    // two inflection points (origin ~0, terminus ~half)
    const base = Math.sin(theta) * 0.22;
    const noise = (rnd() - 0.5) * 0.05;
    values.push(base + noise);
  }
  return values;
}

// Coverage-ish track from a synthetic BED
function generateCoverage(windowCount = 360) {
  const rnd = mulberry32(1234);
  const values = [];
  let v = 0.5;
  for (let i = 0; i < windowCount; i++) {
    v += (rnd() - 0.5) * 0.08;
    v = Math.max(0.1, Math.min(0.95, v));
    // occasional amplified region
    if (i === 120 || i === 121 || i === 122) v = Math.min(1, v + 0.3);
    values.push(v);
  }
  return values;
}

const COMPARISON_GENOMES = generateSyntheticGenomes();

// MULTI_SYNTENY: BLAST ribbons between adjacent genomes in synteny view
// Generate demo BLAST alignments with varied sizes and high density
function generateDemoSynteny() {
  const rnd = mulberry32(99);

  // Helper to generate variable-sized BLAST pairs
  function generatePairs(fromLen, toLen, count) {
    const p = [];
    for (let i = 0; i < count; i++) {
      // Vary segment sizes: some tiny, some small, some large
      const sizeVariation = rnd();
      let len;
      if (sizeVariation < 0.2) {
        len = 1000 + Math.floor(rnd() * 4000);  // very small: 1-5kb
      } else if (sizeVariation < 0.5) {
        len = 5000 + Math.floor(rnd() * 10000); // small: 5-15kb
      } else if (sizeVariation < 0.8) {
        len = 15000 + Math.floor(rnd() * 20000); // medium: 15-35kb
      } else {
        len = 35000 + Math.floor(rnd() * 50000); // large: 35-85kb
      }

      const aStart = Math.floor(rnd() * Math.max(1, fromLen - len));
      const aEnd = Math.min(fromLen, aStart + len);
      const bStart = Math.floor(rnd() * Math.max(1, toLen - (aEnd - aStart)));
      const bEnd = Math.min(toLen, bStart + (aEnd - aStart));

      p.push({
        a: [aStart, aEnd],
        b: [bStart, bEnd],
        identity: 0.65 + rnd() * 0.34,
        inverted: rnd() < 0.12,
      });
    }
    return p;
  }

  return [
    // Reference ↔ Strain A (dense, varied sizes)
    { from: 0, to: 1, pairs: generatePairs(GENOME_LENGTH, COMPARISON_GENOMES[1].length, 40) },

    // Strain A ↔ Strain B (dense, varied sizes)
    { from: 1, to: 2, pairs: generatePairs(COMPARISON_GENOMES[1].length, COMPARISON_GENOMES[2].length, 35) },

    // Strain B ↔ Strain C (new connection, varied sizes)
    { from: 2, to: 3, pairs: generatePairs(COMPARISON_GENOMES[2].length, COMPARISON_GENOMES[3].length, 30) },

    // Reference ↔ Strain B (cross-connection, varied sizes)
    { from: 0, to: 2, pairs: generatePairs(GENOME_LENGTH, COMPARISON_GENOMES[2].length, 25) },

    // Strain A ↔ Strain C (cross-connection, varied sizes)
    { from: 1, to: 3, pairs: generatePairs(COMPARISON_GENOMES[1].length, COMPARISON_GENOMES[3].length, 20) },
  ];
}

const MULTI_SYNTENY = generateDemoSynteny();

// Per-genome features for synteny view (includes demo features for synthetic genomes)
function generateDemoSyntenyFeatures() {
  const rnd = mulberry32(88);
  const cats = Object.keys(FEATURE_CATEGORIES);

  // Helper to generate features for any genome (fewer features = less blob)
  function generateFeaturesForGenome(genomeLength, prefix) {
    const features = [];
    let pos = 1500;
    while (pos < genomeLength - 2000) {
      const featureLen = 300 + Math.floor(rnd() * 2200);
      const strand = rnd() > 0.48 ? 1 : -1;
      const cat = cats[Math.floor(rnd() * cats.length)];
      features.push({
        id: `${prefix}_f${features.length}`,
        start: pos,
        end: Math.min(pos + featureLen, genomeLength),
        strand,
        category: cat,
        gene: `${prefix}_${Math.floor(pos / 10000)}`,
        product: "",
      });
      pos += featureLen + Math.floor(rnd() * 2500); // increased spacing = fewer features
    }
    return features;
  }

  return {
    g1: generateFeaturesForGenome(COMPARISON_GENOMES[1].length, "Strain_A"),
    g2: generateFeaturesForGenome(COMPARISON_GENOMES[2].length, "Strain_B"),
    g3: generateFeaturesForGenome(COMPARISON_GENOMES[3].length, "Strain_C"),
  };
}

const SYNTENY_GENOME_FEATURES = generateDemoSyntenyFeatures();

// Generate demo labels for circular view (~50 labels, unevenly spread to show clustering)
function generateDemoLabels() {
  const rnd = mulberry32(77);
  const colors = ['#5B8AA6', '#7FA876', '#C4976A', '#B67777', '#8878A8', '#D4A84A', '#BCB7A8', '#2B5F6B', '#9C9C9C', '#FF6B6B', '#4ECDC4'];
  const labels = [];

  // Group features by genome region to ensure proper distribution
  const regionSize = GENOME_LENGTH / 4;
  const regions = [[], [], [], []];

  // Sort features into regions by position
  for (const feature of FEATURES) {
    if (!feature || !feature.gene) continue;
    const pos = (feature.start + feature.end) / 2;
    const regionIdx = Math.floor(Math.min(3, pos / regionSize));
    regions[regionIdx].push({ position: Math.floor(pos), name: feature.gene });
  }

  // Pick from each region with different densities
  // Regions 1 and 3 dense, regions 0 and 2 sparse
  const targetCounts = [5, 18, 5, 22]; // uneven distribution across 4 regions

  for (let r = 0; r < 4; r++) {
    const featuresToPick = Math.min(targetCounts[r], regions[r].length);
    const picked = new Set();

    while (picked.size < featuresToPick && picked.size < regions[r].length) {
      const idx = Math.floor(rnd() * regions[r].length);
      if (!picked.has(idx)) {
        picked.add(idx);
        const feature = regions[r][idx];
        labels.push({
          position: feature.position,
          name: feature.name,
          color: colors[Math.floor(rnd() * colors.length)],
          bold: rnd() > 0.65,
          italic: rnd() > 0.55,
        });
      }
    }
  }

  return labels;
}

const DEMO_LABELS = generateDemoLabels();

// BRIG-style per-genome BLAST hit tracks for the circular view.
// Each track is an array of {start, end, identity} segments; gaps = absent in that genome.
function generateBlastRing(seed, presenceRate = 0.85) {
  const rnd = mulberry32(seed);
  const out = [];
  let pos = 0;
  while (pos < GENOME_LENGTH) {
    const len = 3000 + Math.floor(rnd() * 25000);
    const present = rnd() < presenceRate;
    if (present) {
      out.push({
        start: pos,
        end: Math.min(GENOME_LENGTH, pos + len),
        identity: 0.70 + rnd() * 0.29,
      });
    }
    pos += len + Math.floor(rnd() * 2000);
  }
  return out;
}
// Reference = one solid 100%-identity ring covering the full genome (shown as filled line)
const REFERENCE_RING = [{ start: 0, end: GENOME_LENGTH, identity: 1.0 }];
const BLAST_RINGS = {

};

function TrackPanel({ tracks, selectedTrackId, onSelect, onToggleVisible, onReorder, onAddFeatureTrack, onImportBedGraph, onImportVCF }) {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column',

      background: UI.panel, borderRight: `1px solid ${UI.border}`,
      height: '100%', overflow: 'visible',
    }}>

        title="Tracks"
        subtitle="Drawn inner → outer"

      <div style={{ flex: 1, overflowY: 'auto', padding: '4px 0' }}>
        {/* Reverse so innermost is at bottom, outermost at top — matches visual */}
        {[...tracks].reverse().map((t, i) => (
          <TrackRow
            key={t.id}
            track={t}
            selected={t.id === selectedTrackId}
            onSelect={() => onSelect(t.id)}
            onToggleVisible={() => onToggleVisible(t.id)}

}

function TrackRow({ track, selected, onSelect, onToggleVisible, onMoveUp, onMoveDown, canMoveUp, canMoveDown }) {
  const swatchColor = track.color || track.posColor || track.bg || '#888';
  const typeLabels = {
    'ruler': 'Ruler',
    'cds': 'CDS',
    'rna': 'RNA',
    'mobile': 'Mobile',
    'gc': 'GC%',
    'gc-skew': 'Skew',

// ============================================================
// circular-genome.jsx
// ============================================================

// Circular genome renderer — SVG. Real geometry, not placeholder.
// All radii/thicknesses are fractions of the canvas radius (0–1).

const TAU = Math.PI * 2;

// Convert bp to angle. 12 o'clock = 0 bp, clockwise.
function bpToAngle(bp, genomeLen) {
  return (bp / genomeLen) * TAU - Math.PI / 2;
}

function polar(cx, cy, r, angle) {
  return [cx + Math.cos(angle) * r, cy + Math.sin(angle) * r];
}

// Arc path (large-arc-flag aware)
function arcPath(cx, cy, r, a0, a1, sweep = 1) {
  const [x0, y0] = polar(cx, cy, r, a0);
  const [x1, y1] = polar(cx, cy, r, a1);
  const delta = a1 - a0;
  const large = Math.abs(delta) > Math.PI ? 1 : 0;
  return `M ${x0} ${y0} A ${r} ${r} 0 ${large} ${sweep} ${x1} ${y1}`;
}

// Annular segment between two radii, two angles
function annularSegment(cx, cy, rIn, rOut, a0, a1) {
  const [x0o, y0o] = polar(cx, cy, rOut, a0);
  const [x1o, y1o] = polar(cx, cy, rOut, a1);
  const [x0i, y0i] = polar(cx, cy, rIn, a0);
  const [x1i, y1i] = polar(cx, cy, rIn, a1);
  const delta = a1 - a0;
  const large = Math.abs(delta) > Math.PI ? 1 : 0;
  return (
    `M ${x0o} ${y0o} ` +
    `A ${rOut} ${rOut} 0 ${large} 1 ${x1o} ${y1o} ` +
    `L ${x1i} ${y1i} ` +
    `A ${rIn} ${rIn} 0 ${large} 0 ${x0i} ${y0i} Z`
  );
}

// Arrow-shaped feature (annular segment with a pointed head) — head faces direction of strand
function featureArrow(cx, cy, rIn, rOut, a0, a1, strand, headFrac = 0.35, capPx = 0.012) {
  // Clip head length so it never exceeds the arc length
  const arcLen = Math.abs(a1 - a0);
  const headAng = Math.min(arcLen * headFrac, capPx);
  if (arcLen < 0.0008) {
    // degenerate — draw tiny triangle
    return annularSegment(cx, cy, rIn, rOut, a0, a1);
  }

  const rMid = (rIn + rOut) / 2;
  let tailStart, tailEnd, tip;
  if (strand >= 0) {
    // head at a1 end
    tailStart = a0;
    tailEnd = a1 - headAng;
    tip = a1;
  } else {
    // head at a0 end
    tailStart = a0 + headAng;
    tailEnd = a1;
    tip = a0;
  }

  const [pTailStartO_x, pTailStartO_y] = polar(cx, cy, rOut, tailStart);
  const [pTailEndO_x, pTailEndO_y]     = polar(cx, cy, rOut, tailEnd);
  const [pTipX, pTipY]                 = polar(cx, cy, rMid, tip);
  const [pTailEndI_x, pTailEndI_y]     = polar(cx, cy, rIn, tailEnd);
  const [pTailStartI_x, pTailStartI_y] = polar(cx, cy, rIn, tailStart);

  const tailArcLen = Math.abs(tailEnd - tailStart);
  const large = tailArcLen > Math.PI ? 1 : 0;

  if (strand >= 0) {
    return (
      `M ${pTailStartO_x} ${pTailStartO_y} ` +
      `A ${rOut} ${rOut} 0 ${large} 1 ${pTailEndO_x} ${pTailEndO_y} ` +
      `L ${pTipX} ${pTipY} ` +
      `L ${pTailEndI_x} ${pTailEndI_y} ` +
      `A ${rIn} ${rIn} 0 ${large} 0 ${pTailStartI_x} ${pTailStartI_y} Z`
    );
  } else {
    return (
      `M ${pTipX} ${pTipY} ` +
      `L ${pTailStartO_x} ${pTailStartO_y} ` +
      `A ${rOut} ${rOut} 0 ${large} 1 ${pTailEndO_x} ${pTailEndO_y} ` +
      `L ${pTailEndI_x} ${pTailEndI_y} ` +
      `A ${rIn} ${rIn} 0 ${large} 0 ${pTailStartI_x} ${pTailStartI_y} Z`
    );
  }
}

// ============================================================
// Tick marks for coordinate ruler
// ============================================================
function RulerTrack({ cx, cy, baseR, thickness, genomeLen, color, inside = false }) {
  const rIn = baseR;
  const rOut = baseR + thickness;

  // Dynamically determine tick intervals based on genome size
  const determineTickIntervals = (len) => {
    if (len < 10000) return { minor: 1000, major: 5000 }; // < 10 kb
    if (len < 100000) return { minor: 10000, major: 50000 }; // < 100 kb
    if (len < 1000000) return { minor: 50000, major: 250000 }; // < 1 Mb
    if (len < 5000000) return { minor: 100000, major: 500000 }; // < 5 Mb
    return { minor: 500000, major: 2000000 }; // > 5 Mb
  };
  const { minor: minorInterval, major: majorInterval } = determineTickIntervals(genomeLen);

  const majors = [];
  const minors = [];
  for (let bp = 0; bp < genomeLen; bp += minorInterval) {
    const a = bpToAngle(bp, genomeLen);
    const isMajor = bp % majorInterval === 0;
    const tickOut = isMajor ? rOut + 0.018 : rOut + 0.008;
    const [x0, y0] = polar(cx, cy, rOut, a);
    const [x1, y1] = polar(cx, cy, tickOut, a);
    (isMajor ? majors : minors).push(
      <line key={bp} x1={x0} y1={y0} x2={x1} y2={y1}
            stroke={color} strokeWidth={isMajor ? 0.002 : 0.001} />
    );
  }

  const labels = [];
  for (let bp = 0; bp < genomeLen; bp += majorInterval) {
    const a = bpToAngle(bp, genomeLen);
    const [lx, ly] = polar(cx, cy, rOut + 0.035, a);
    const rotDeg = (a * 180) / Math.PI + 90;
    const flip = rotDeg > 90 && rotDeg < 270;
    if (bp === 0) continue;
    const useMb = genomeLen >= 1e6;
    const labelText = useMb
      ? `${(bp / 1e6).toFixed(bp % 1e6 === 0 ? 0 : 1)} Mb`
      : `${(bp / 1e3).toFixed(0)} kb`;
    labels.push(
      <text key={`lbl-${bp}`} x={lx} y={ly}
            textAnchor="middle" dominantBaseline="middle"
            fontSize={0.022} fontFamily="'IBM Plex Mono', monospace"
            fill={color}
            transform={`rotate(${flip ? rotDeg + 180 : rotDeg} ${lx} ${ly})`}>
        {labelText}
      </text>
    );
  }

  return (
    <g>
      <circle cx={cx} cy={cy} r={rIn} fill="none" stroke={color} strokeWidth={0.0015} />
      <circle cx={cx} cy={cy} r={rOut} fill="none" stroke={color} strokeWidth={0.0015} />
      {minors}
      {majors}
      {labels}
    </g>
  );
}

// ============================================================
// CDS arrows track — filtered by strand and source track ID
// ============================================================
function CDSTrack({ cx, cy, baseR, thickness, features, strand, genomeLen, colorMap, onHover, onClick, hoveredId, trackId }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  // Filter by strand AND by track ID prefix (so imported/genbank tracks only show their own features)
  const filtered = features.filter(f => f.strand === strand && (!trackId || f.id.startsWith(trackId)));
  return (
    <g>
      {filtered.map(f => {
        const a0 = bpToAngle(f.start, genomeLen);
        const a1 = bpToAngle(f.end, genomeLen);
        const color = colorMap[f.category] || "#888";
        const isHovered = hoveredId === f.id;
        return (
          <path
            key={f.id}
            d={featureArrow(cx, cy, rIn, rOut, a0, a1, strand)}
            fill={color}
            stroke={isHovered ? "#1A1A1A" : "none"}
            strokeWidth={isHovered ? 0.002 : 0}
            opacity={isHovered ? 1 : 0.92}
            onMouseEnter={() => onHover && onHover(f)}
            onMouseLeave={() => onHover && onHover(null)}
            onClick={() => onClick && onClick(f)}
            style={{ cursor: 'pointer', transition: 'opacity 120ms' }}
          />
        );
      })}
    </g>
  );
}

// ============================================================
// BLAST ring — BRIG-style presence/absence ring.
// Solid wherever there's a hit, gap where absent. Color intensity by identity.
// ============================================================
function BlastRingTrack({ cx, cy, baseR, thickness, segments, color, genomeLen, opacity = 1 }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  return (
    <g opacity={opacity}>
      {/* faint backing so gaps are visible */}
      <path d={annularSegment(cx, cy, rIn, rOut, 0, TAU - 0.0001)}
            fill={color} opacity={0.08} />
      {segments.map((s, i) => {
        let a0 = bpToAngle(s.start, genomeLen);
        let a1 = bpToAngle(s.end, genomeLen);
        // If this is a full-circle segment, reduce end slightly to avoid SVG arc issues
        if (Math.abs(a1 - a0) >= TAU - 0.001) {
          a1 = a0 + TAU - 0.0001;
        }
        // identity 0..1.0 → opacity 0.1..1.0 (0% = white, 100% = solid)
        const op = 0.1 + (s.identity * 0.9);
        return <path key={i} d={annularSegment(cx, cy, rIn, rOut, a0, a1)}
                     fill={color} opacity={op} />;
      })}
    </g>
  );
}

// ============================================================
// VCF track — variants as lollipops (SNP/INS/DEL) and arcs (SV)
// ============================================================
function VCFTrack({ cx, cy, baseR, thickness, variants, genomeLen, hoveredId, onHover, onClick }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  const VCF_COLORS = { SNP: '#5B8AA6', INS: '#7FA876', DEL: '#B67777', SV: '#8878A8' };

  return (
    <g>
      {variants.map(v => {
        const color = VCF_COLORS[v.varType] || '#999';
        const isHovered = hoveredId === v.id;
        const strokeWidth = isHovered ? 0.0025 : 0.0015;
        const angle = bpToAngle(v.pos, genomeLen);

        if (v.varType === 'SV') {
          // Draw quadratic bezier arc from pos to end
          const angleEnd = bpToAngle(v.end, genomeLen);
          const [x0, y0] = polar(cx, cy, rOut, angle);
          const [x1, y1] = polar(cx, cy, rOut, angleEnd);
          const midAngle = (angle + angleEnd) / 2;
          const [xMid, yMid] = polar(cx, cy, rOut + 0.02, midAngle);

          const pathD = `M ${x0} ${y0} Q ${xMid} ${yMid} ${x1} ${y1}`;
          return (
            <path key={v.id}
                  d={pathD}
                  stroke={color}
                  strokeWidth={strokeWidth}
                  fill="none"
                  opacity={isHovered ? 1 : 0.7}
                  onMouseEnter={() => onHover(v)}
                  onMouseLeave={() => onHover(null)}
                  onClick={() => onClick(v)}
                  style={{ cursor: 'pointer' }} />
          );
        } else {
          // SNP/INS/DEL: vertical lollipop
          const [tipX, tipY] = polar(cx, cy, rOut, angle);
          const [baseX, baseY] = polar(cx, cy, rIn, angle);

          return (
            <g key={v.id}
               onMouseEnter={() => onHover(v)}
               onMouseLeave={() => onHover(null)}
               onClick={() => onClick(v)}
               style={{ cursor: 'pointer' }}>
              <line x1={baseX} y1={baseY} x2={tipX} y2={tipY}
                    stroke={color} strokeWidth={strokeWidth}
                    opacity={isHovered ? 1 : 0.7} />
              <circle cx={tipX} cy={tipY} r={isHovered ? 0.0035 : 0.0025}
                      fill={color} opacity={isHovered ? 1 : 0.8} />
            </g>
          );
        }
      })}
    </g>
  );
}

// ============================================================
// Simple feature track (RNA, mobile elements) — just filled segments
// ============================================================
function SegmentTrack({ cx, cy, baseR, thickness, features, color, genomeLen }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  return (
    <g>
      {features.map(f => {
        const a0 = bpToAngle(f.start, genomeLen);
        const a1 = bpToAngle(f.end, genomeLen);
        return (
          <path key={f.id} d={annularSegment(cx, cy, rIn, rOut, a0, a1)}
                fill={color} opacity={0.9} />
        );
      })}
    </g>
  );
}

// ============================================================
// GC content — per-window wedge from midline outward/inward
// ============================================================
function GCTrack({ cx, cy, baseR, thickness, values, color, genomeLen }) {
  // Calculate mean from actual values if not explicitly provided
  const mean = values.length > 0
    ? values.reduce((a, b) => a + b, 0) / values.length
    : 0.5;

  const rIn = baseR;
  const rOut = baseR + thickness;
  const rMid = (rIn + rOut) / 2;
  const n = values.length;
  const wedges = [];
  for (let i = 0; i < n; i++) {
    const a0 = bpToAngle((i / n) * genomeLen, genomeLen);
    const a1 = bpToAngle(((i + 1) / n) * genomeLen, genomeLen);
    const dev = Math.max(-1, Math.min(1, (values[i] - mean) / 0.08));
    const h = dev * (thickness / 2);
    const rA = h >= 0 ? rMid : rMid + h;
    const rB = h >= 0 ? rMid + h : rMid;
    if (Math.abs(h) < 0.0001) continue;
    wedges.push(
      <path key={i} d={annularSegment(cx, cy, rA, rB, a0, a1)}
            fill={color} opacity={0.85} />
    );
  }
  return (
    <g>
      <circle cx={cx} cy={cy} r={rIn} fill="none" stroke="#D9D4C7" strokeWidth={0.001} />
      <circle cx={cx} cy={cy} r={rOut} fill="none" stroke="#D9D4C7" strokeWidth={0.001} />
      <circle cx={cx} cy={cy} r={rMid} fill="none" stroke="#C8C3B4" strokeWidth={0.0008} strokeDasharray="0.004 0.004" />
      {wedges}
    </g>
  );
}

// ============================================================
// GC skew — two colors above/below baseline
// ============================================================
function GCSkewTrack({ cx, cy, baseR, thickness, values, posColor, negColor, genomeLen }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  const rMid = (rIn + rOut) / 2;

  // Calculate normalization factor from actual data range
  const absValues = values.map(v => Math.abs(v));
  const maxAbsValue = absValues.length > 0 ? Math.max(...absValues) : 0.5;
  const normFactor = maxAbsValue > 0 ? maxAbsValue : 0.5;

  const n = values.length;
  const wedges = [];
  for (let i = 0; i < n; i++) {
    const a0 = bpToAngle((i / n) * genomeLen, genomeLen);
    const a1 = bpToAngle(((i + 1) / n) * genomeLen, genomeLen);
    const v = values[i];
    const dev = Math.max(-1, Math.min(1, v / normFactor));
    const h = dev * (thickness / 2);
    if (Math.abs(h) < 0.0001) continue;
    const rA = h >= 0 ? rMid : rMid + h;
    const rB = h >= 0 ? rMid + h : rMid;
    wedges.push(
      <path key={i} d={annularSegment(cx, cy, rA, rB, a0, a1)}
            fill={v >= 0 ? posColor : negColor} opacity={0.85} />
    );
  }
  return (
    <g>
      <circle cx={cx} cy={cy} r={rMid} fill="none" stroke="#C8C3B4" strokeWidth={0.0008} strokeDasharray="0.004 0.004" />
      {wedges}
    </g>
  );
}

// ============================================================
// BED / coverage track — outward bars from inner radius
// ============================================================
function BEDTrack({ cx, cy, baseR, thickness, values, color, bg, genomeLen }) {
  const rIn = baseR;
  const rOut = baseR + thickness;
  // draw as stacked thin wedges
  const n = values.length;
  const bars = [];
  for (let i = 0; i < n; i++) {
    const a0 = bpToAngle((i / n) * genomeLen, genomeLen);
    const a1 = bpToAngle(((i + 1) / n) * genomeLen, genomeLen);
    const h = values[i] * thickness;
    bars.push(
      <path key={i} d={annularSegment(cx, cy, rIn, rIn + h, a0, a1)}
            fill={color} opacity={0.85} />
    );
  }
  return (
    <g>
      <path d={annularSegment(cx, cy, rIn, rOut, 0, TAU - 0.0001)}
            fill={bg || "#EFEBE1"} opacity={0.7} />
      {bars}
    </g>
  );
}

// ============================================================
// Gene labels — curated, UPRIGHT always, with leader lines.
// De-overlap: push angularly so labels never stack on top of each other.
// ============================================================
function LabelsTrack({ cx, cy, baseR, labels, genomeLen, color, autoR }) {
  const effectiveR = autoR !== undefined ? autoR : baseR;

  // Push labels further out so they sit clearly above all visible tracks,
  // not kissing them. Each label has a leader from the track edge out to
  // its de-overlapped position.
  const labelR = effectiveR + 0.08;
  // Desired min angular separation (in radians). At ~labelR radius this
  // corresponds to roughly the height of the text label.
  const minAngular = 0.085 / labelR;
  const sorted = labels.map(l => {
    const a = bpToAngle(l.position, genomeLen);
    return { ...l, a, da: a };
  }).sort((x, y) => x.a - y.a);

  for (let iter = 0; iter < 120; iter++) {
    let moved = false;
    for (let i = 0; i < sorted.length; i++) {
      const a = sorted[i];
      const b = sorted[(i + 1) % sorted.length];
      let gap = b.da - a.da;
      if (i === sorted.length - 1) gap += Math.PI * 2;
      if (gap < minAngular) {
        const push = (minAngular - gap) / 2 + 0.0001;
        a.da -= push;
        b.da += push;
        moved = true;
      }
    }
    if (!moved) break;
  }

  return (
    <g>
      {sorted.map((lbl) => {
        const aAnchor = lbl.a;
        const aDodged = lbl.da;
        // Leader from OUTSIDE the outer track edge to the label anchor point.
        const [x0, y0] = polar(cx, cy, effectiveR + 0.005, aAnchor);
        const [x1, y1] = polar(cx, cy, effectiveR + 0.04, aAnchor);
        const [xk, yk] = polar(cx, cy, effectiveR + 0.07, aDodged);
        // Text placement: anchor based on angular position so labels don't
        // slice back through the rings on left/right sides.
        const cosA = Math.cos(aDodged);
        const isRight = cosA > 0.12;   // clearly right half → left-anchor
        const isLeft  = cosA < -0.12;  // clearly left half  → right-anchor
        const anchorMode = isRight ? 'start' : isLeft ? 'end' : 'middle';
        // Push text further on sides so leader has room
        const textOffset = (isRight || isLeft) ? 0.092 : 0.085;
        const [tx, ty] = polar(cx, cy, effectiveR + textOffset, aDodged);
        return (
          <g key={lbl.name}>
            <line x1={x0} y1={y0} x2={x1} y2={y1} stroke={lbl.color || color} strokeWidth={0.0012} />
            <line x1={x1} y1={y1} x2={xk} y2={yk} stroke={lbl.color || color} strokeWidth={0.0008} opacity={0.6} />
            {/* UPRIGHT label — no rotation, always readable */}
            <text x={tx} y={ty}
                  textAnchor={anchorMode} dominantBaseline="middle"
                  fontSize={0.022} fontFamily="'IBM Plex Sans', sans-serif"
                  fontStyle={lbl.italic ? "italic" : "normal"}
                  fontWeight={lbl.bold ? 700 : 500}
                  fill={lbl.color || color}>
              {lbl.name}
            </text>
          </g>
        );
      })}
    </g>
  );
}

// ============================================================
// Main circular genome SVG
// ============================================================
function CircularGenome({
  tracks, features, gcContent, gcSkew, coverage, labels,
  genomeLen, genomeName, accession,
  hoveredId, setHoveredId, setSelectedFeature,
  highlights = [],
  zoom = 1, panX = 0, panY = 0,
  onViewChange,
}) {
  // Ensure values are never null/undefined
  const safeZoom = zoom ?? 1;
  const safePanX = panX ?? 0;
  const safePanY = panY ?? 0;

  // We use a 1×1 coordinate system centered at (0.5, 0.5). Expanded viewBox gives headroom for outer rings.
  const cx = 0.5, cy = 0.5;
  const svgRef = React.useRef(null);
  const panState = React.useRef(null);

  const onWheel = (e) => {
    if (!onViewChange) return;
    try {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const newZoom = Math.max(0.5, Math.min(8, safeZoom * factor));
      onViewChange({ zoom: newZoom, panX: safePanX, panY: safePanY });
    } catch (err) {
      console.warn('[Gyre] Wheel event error:', err);
    }
  };

  const onMouseDown = (e) => {
    try {
      panState.current = { startX: e.clientX, startY: e.clientY, panX: safePanX, panY: safePanY };
    } catch (err) {
      console.warn('[Gyre] Mouse down error:', err);
    }
  };
  const onMouseMove = (e) => {
    if (!panState.current || !onViewChange) return;
    try {
      const dx = (e.clientX - panState.current.startX) / (svgRef.current?.clientWidth || 800);
      const dy = (e.clientY - panState.current.startY) / (svgRef.current?.clientHeight || 800);
      const newPanX = (panState.current.panX ?? 0) + dx;
      const newPanY = (panState.current.panY ?? 0) + dy;
      onViewChange({ zoom: safeZoom, panX: newPanX, panY: newPanY });
    } catch (err) {
      console.warn('[Gyre] Mouse move error:', err);
    }
  };
  const endPan = () => { panState.current = null; };

  // Highlight regions (wedges spanning from center out through all track rings)
  const highlightEls = highlights.map((h, i) => {
    const a0 = bpToAngle(h.start, genomeLen);
    const a1 = bpToAngle(h.end, genomeLen);
    return (
      <path key={i}
            d={annularSegment(cx, cy, 0.14, 0.90, a0, a1)}
            fill={h.color} opacity={h.opacity ?? 0.18} />
    );
  });

  return (
    <svg ref={svgRef} viewBox="-0.18 -0.18 1.36 1.36"
         style={{ width: '100%', height: '100%', display: 'block',
                  cursor: panState.current ? 'grabbing' : 'grab',
                  touchAction: 'none', userSelect: 'none' }}
         onWheel={onWheel}
         onMouseDown={onMouseDown}
         onMouseMove={onMouseMove}
         onMouseUp={endPan}
         onMouseLeave={endPan}
         preserveAspectRatio="xMidYMid meet">
      <g transform={`translate(${safePanX} ${safePanY}) translate(${cx} ${cy}) scale(${safeZoom}) translate(${-cx} ${-cy})`}>
      {/* soft paper background */}
      <defs>
        <radialGradient id="paper" cx="0.5" cy="0.5" r="0.7">
          <stop offset="0%" stopColor="#FDFBF6" />
          <stop offset="100%" stopColor="#F5F1E6" />
        </radialGradient>
      </defs>

      {/* inner cartouche */}
      <circle cx={cx} cy={cy} r={0.14} fill="url(#paper)" stroke="#E5DFCF" strokeWidth={0.0012} />

      {/* Genome title in the middle — single line, scaled to fit the cartouche */}
      {(() => {
        // Pick a font size so the whole name fits inside the inner cartouche (r=0.14).
        // We have roughly 0.24 units of horizontal room (with margin for the accession line below).
        const nameLen = genomeName.length;
        const titleSize = Math.min(0.028, 0.22 / Math.max(6, nameLen * 0.55));
        return (
          <text x={cx} y={cy - 0.005} textAnchor="middle"
                fontSize={titleSize} fontWeight={600}
                fontFamily="'IBM Plex Sans', sans-serif"
                fill="#1A1A1A" fontStyle="italic">
            {genomeName}
          </text>
        );
      })()}
      <text x={cx} y={cy + 0.035} textAnchor="middle"
            fontSize={0.014}
            fontFamily="'IBM Plex Mono', monospace"
            fill="#6A6A6A">
        {accession}
      </text>
      <text x={cx} y={cy + 0.055} textAnchor="middle"
            fontSize={0.013}
            fontFamily="'IBM Plex Mono', monospace"
            fill="#6A6A6A">
        {(genomeLen / 1000).toFixed(0).toLocaleString()},{String(genomeLen).slice(-3)} bp
      </text>

      {/* highlights behind tracks */}
      {highlightEls}

      {/* render each visible track in order (inner → outer) */}
      {(() => {
        const vis = tracks.filter(t => t.visible);
        // Outermost non-label top (r + half thickness) — labels auto-push above this
        const maxTop = Math.max(
          0,
          ...vis.filter(t => t.type !== 'labels')
                .map(t => (t.radius || 0) + (t.thickness || 0) / 2)
        );
        const labelAutoR = maxTop + 0.04;
        return vis.map(t => {
        if (t.type === 'ruler') {
          return <RulerTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                             genomeLen={genomeLen} color={t.color} />;
        }
        if (t.type === 'gc') {
          return <GCTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                           values={gcContent} color={t.color} genomeLen={genomeLen} />;
        }
        if (t.type === 'gc-skew') {
          return <GCSkewTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                               values={gcSkew} posColor={t.posColor} negColor={t.negColor} genomeLen={genomeLen} />;
        }
        if (t.type === 'bed') {
          return <BEDTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                            values={coverage} color={t.color} bg={t.bg} genomeLen={genomeLen} />;
        }
        if (t.type === 'bedgraph') {
          const bg = (window.USER_BEDGRAPHS && window.USER_BEDGRAPHS[t.id]) || { values: [] };
          return <BEDTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                            values={bg.values} color={t.color} bg={t.bg} genomeLen={genomeLen} />;
        }
        if (t.type === 'cds') {
          const colorMap = Object.fromEntries(
            Object.entries(FEATURE_CATEGORIES).map(([k, v]) => [k, v.color])
          );
          return <CDSTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                            features={features} strand={t.strand} genomeLen={genomeLen}
                            colorMap={colorMap}
                            hoveredId={hoveredId}
                            onHover={f => setHoveredId(f ? f.id : null)}
                            onClick={f => setSelectedFeature(f)}
                            trackId={t.userImported ? t.id.split('-').slice(0, -1).join('-') : null} />;
        }
        if (t.type === 'rna') {
          return <SegmentTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                                features={features.filter(f => f.category === 'RNA')}
                                color={t.color} genomeLen={genomeLen} />;
        }
        if (t.type === 'mobile') {
          return <SegmentTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                                features={features.filter(f => f.category === 'Mobile elements')}
                                color={t.color} genomeLen={genomeLen} />;
        }
        if (t.type === 'blast-ring') {
          const segments = (window.BLAST_RINGS && window.BLAST_RINGS[t.ringId]) || [];
          return <BlastRingTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                                  segments={segments} color={t.color} genomeLen={genomeLen}
                                  opacity={t.opacity ?? 1} />;
        }
        if (t.type === 'vcf') {
          const variants = (window.USER_VCF && window.USER_VCF[t.id]) || [];
          return <VCFTrack key={t.id} cx={cx} cy={cy} baseR={t.radius} thickness={t.thickness}
                           variants={variants} genomeLen={genomeLen}
                           hoveredId={hoveredId} onHover={v => setHoveredId(v ? v.id : null)}
                           onClick={v => setSelectedFeature(v)} />;
        }
        if (t.type === 'labels') {
          return <LabelsTrack key={t.id} cx={cx} cy={cy} baseR={t.radius}
                               autoR={labelAutoR}
                               labels={labels} genomeLen={genomeLen} color={t.color} />;
        }
        return null;
      });
      })()}
      </g>
    </svg>
  );
}

// ============================================================
// linear-genome.jsx
// ============================================================

// Linear genome view + synteny (two genomes stacked with BLAST ribbons)
// Same coord system idea: a rectangle in (0..1) x (0..1)

function LinearGenome({
  features, gcContent, gcSkew, coverage, labels,
  genomeLen, genomeName, accession,
  viewStart, viewEnd,
  hoveredId, setHoveredId, setSelectedFeature,
  height = 0.58, yOffset = 0.2,
  showGC = true, showSkew = true, showCoverage = true, showLabels = true,
  compact = false,
  filterStart = null, filterEnd = null, onSetFilter = () => {},
  zoom = 1, panX = 0, panY = 0, onViewChange = () => {},
}) {
  // Label customization state
  const [labelSettings, setLabelSettings] = React.useState({
    fadeMode: 'fade-cross', // 'never', 'fade-cross', 'custom'
    fadeOpacity: 0.2,
    fadeDistance: 0.008,
    fadeStartDistance: 0.015, // distance from text where fade starts
    minHorizontalGap: 0.08,
    minVerticalGap: 0.025,
    maxVerticalExtent: 0.12,
    showMode: 'all', // 'all', 'top10', 'top20', 'top50'
    filterCategory: null,
    filterPositionRange: null,
    fontSize: 0.018,
    angleLabels: false,
    labelAngle: 0, // degrees
    showLeaders: true,
    positionMode: 'above', // 'above', 'below', 'alternating'
    verticalOffset: 0.040,
  });
  const [showLabelModal, setShowLabelModal] = React.useState(false);

  // Measure container aspect so we can counter-scale <text> and prevent
  // horizontal stretching caused by preserveAspectRatio="none".
  const svgRef = React.useRef(null);
  const [aspect, setAspect] = React.useState(3); // w/h
  const [isDragging, setIsDragging] = React.useState(false);
  const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });

  React.useEffect(() => {
    if (!svgRef.current) return;
    const ro = new ResizeObserver(entries => {
      for (const e of entries) {
        const cr = e.contentRect;
        if (cr.height > 0) setAspect(Math.max(0.1, cr.width / cr.height));
      }
    });
    ro.observe(svgRef.current);
    return () => ro.disconnect();
  }, []);

  // Pan with mouse drag
  const handleMouseDown = (e) => {
    setIsDragging(true);
    setDragStart({ x: e.clientX, y: e.clientY });
  };

  const handleMouseMove = (e) => {
    if (!isDragging) return;
    const dx = (e.clientX - dragStart.x) / (svgRef.current?.clientWidth || 1) * 0.2;
    const dy = (e.clientY - dragStart.y) / (svgRef.current?.clientHeight || 1) * 0.2;
    onViewChange({ zoom, panX: panX + dx, panY: panY + dy });
    setDragStart({ x: e.clientX, y: e.clientY });
  };

  const handleMouseUp = () => {
    setIsDragging(false);
  };

  React.useEffect(() => {
    if (!isDragging) return;
    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
    return () => {
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
    };
  }, [isDragging, dragStart, zoom, panX, panY]);
  // Helper: render text at fractional (fx, fy) counter-scaled to avoid the
  // non-uniform viewBox stretching.
  const UText = ({ fx, fy, children, ...rest }) => (
    <g transform={`translate(${fx} ${fy}) scale(${1 / aspect} 1)`}>
      <text {...rest}>{children}</text>
    </g>
  );

  // Determine effective display range: use filter if active, otherwise use view range
  const safeViewStart = viewStart ?? 0;
  const safeViewEnd = viewEnd ?? genomeLen;
  const displayStart = filterStart !== null ? filterStart : safeViewStart;
  const displayEnd = filterEnd !== null ? filterEnd : safeViewEnd;

  const effectiveSpan = displayEnd - displayStart || 1;
  const bpToX = (bp) => ((bp - displayStart) / effectiveSpan);
  const span = effectiveSpan;

  // Visible features only - filter to display range
  const visibleFeats = features.filter(f => f.end >= displayStart && f.start <= displayEnd);

  const yTop = yOffset;
  const H = height;
  const axisY = yTop + H * 0.48;
  const trackH = H * 0.08;
  const fwdY = axisY - trackH - 0.005;
  const revY = axisY + 0.005;

  // GC track area
  const gcY = yTop + H * 0.78;
  const gcH = H * 0.10;
  const skewY = yTop + H * 0.90;
  const skewH = H * 0.07;
  const covY = yTop + H * 0.04;
  const covH = H * 0.12;

  // Compute GC / skew / coverage indices for display range
  const gcN = gcContent.length;
  const winBp = genomeLen / gcN;
  const firstIdx = Math.max(0, Math.floor(displayStart / winBp));
  const lastIdx = Math.min(gcN - 1, Math.ceil(displayEnd / winBp));

  const colorMap = Object.fromEntries(
    Object.entries(FEATURE_CATEGORIES).map(([k, v]) => [k, v.color])
  );

  // CDS as arrows (rectangle with triangular head)
  const cdsArrow = (f) => {
    const x0 = bpToX(f.start);
    const x1 = bpToX(f.end);
    const w = x1 - x0;
    const y = f.strand >= 0 ? fwdY : revY;
    const h = trackH;
    const headW = Math.min(w * 0.5, 0.006);
    if (f.strand >= 0) {
      return `M ${x0} ${y} L ${x1 - headW} ${y} L ${x1} ${y + h / 2} L ${x1 - headW} ${y + h} L ${x0} ${y + h} Z`;
    } else {
      return `M ${x1} ${y} L ${x0 + headW} ${y} L ${x0} ${y + h / 2} L ${x0 + headW} ${y + h} L ${x1} ${y + h} Z`;
    }
  };

  // GC line
  const gcPath = (() => {
    let d = '';
    for (let i = firstIdx; i <= lastIdx; i++) {
      const bp = i * winBp;
      const x = bpToX(bp);
      const v = gcContent[i];
      const dev = (v - 0.655) / 0.08;
      const y = gcY + gcH / 2 - dev * (gcH / 2);
      d += `${i === firstIdx ? 'M' : 'L'} ${x} ${y} `;
    }
    return d;
  })();

  // Skew bars
  const skewBars = [];
  for (let i = firstIdx; i <= lastIdx; i++) {
    const bp = i * winBp;
    const x = bpToX(bp);
    const bpNext = (i + 1) * winBp;
    const xNext = bpToX(bpNext);
    const v = gcSkew[i];
    const dev = Math.max(-1, Math.min(1, v / 0.3));
    const h = dev * (skewH / 2);
    const baseY = skewY + skewH / 2;
    skewBars.push(
      <rect key={i} x={x} y={h < 0 ? baseY : baseY - Math.abs(h)}
            width={Math.max(0.0005, xNext - x)} height={Math.abs(h)}
            fill={v >= 0 ? "#7FA876" : "#B67777"} opacity={0.8} />
    );
  }

  // Coverage bars
  const covBars = [];
  for (let i = firstIdx; i <= lastIdx; i++) {
    const bp = i * winBp;
    const x = bpToX(bp);
    const bpNext = (i + 1) * winBp;
    const xNext = bpToX(bpNext);
    const v = coverage[i];
    const h = v * covH;
    covBars.push(
      <rect key={i} x={x} y={covY + covH - h}
            width={Math.max(0.0005, xNext - x)} height={h}
            fill="#5B8AA6" opacity={0.85} />
    );
  }

  // Labels (curated) - apply all filters
  let visibleLabels = labels.filter(l => l.position >= displayStart && l.position <= displayEnd);

  // Apply showMode filter (top N labels)
  if (labelSettings.showMode === 'top10') {
    visibleLabels = visibleLabels.slice(0, 10);
  } else if (labelSettings.showMode === 'top20') {
    visibleLabels = visibleLabels.slice(0, 20);
  } else if (labelSettings.showMode === 'top50') {
    visibleLabels = visibleLabels.slice(0, 50);
  }

  // Apply category filter if set
  if (labelSettings.filterCategory) {
    visibleLabels = visibleLabels.filter(l => l.category === labelSettings.filterCategory);
  }

  // Apply position range filter if set
  if (labelSettings.filterPositionRange) {
    const [minPos, maxPos] = labelSettings.filterPositionRange;
    visibleLabels = visibleLabels.filter(l => l.position >= minPos && l.position <= maxPos);
  }

  // Ruler ticks
  const tickStep = niceTickStep(span);
  const ticks = [];
  for (let bp = Math.ceil(displayStart / tickStep) * tickStep; bp <= displayEnd; bp += tickStep) {
    const x = bpToX(bp);
    ticks.push(
      <g key={bp}>
        <line x1={x} y1={axisY - 0.008} x2={x} y2={axisY + trackH + 0.008}
              stroke="#9A9484" strokeWidth={0.0006} />
        <UText fx={x} fy={axisY + trackH + 0.032}
               textAnchor="middle" fontSize={0.014}
               fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
          {formatBp(bp)}
        </UText>
      </g>
    );
  }

  // Measure container aspect so we can counter-scale <text> and prevent
  // horizontal stretching caused by preserveAspectRatio="none".
  // (aspect + UText defined at top of component)

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%' }}>
      <svg ref={svgRef} viewBox="0 0 1 1"
           style={{ width: '100%', height: '100%', display: 'block', userSelect: 'none', cursor: isDragging ? 'grabbing' : 'grab' }}
           preserveAspectRatio="none"
           onMouseDown={handleMouseDown}>
      <defs>
        <pattern id="stripeBg" width="0.006" height="0.006" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="0.006" height="0.006" fill="#FAF8F2" />
          <line x1="0" y1="0" x2="0" y2="0.006" stroke="#EFEBE1" strokeWidth="0.002" />
        </pattern>
      </defs>

      <g transform={`translate(${panX} ${panY}) scale(${zoom})`}>
      {/* Header */}
      <UText fx={0.01} fy={0.055} fontSize={0.032} fontWeight={600}
             fontFamily="'IBM Plex Sans', sans-serif" fontStyle="italic"
             fill="#1A1A1A">{genomeName}</UText>
      <UText fx={0.01} fy={0.092} fontSize={0.02}
             fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
        {accession} · {formatBp(displayStart)}–{formatBp(displayEnd)} · {formatBp(span)} span
      </UText>


      {/* Coverage */}
      {showCoverage && (
        <g>
          <UText fx={0.01} fy={covY + 0.013} fontSize={0.013}
                 fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
            Coverage
          </UText>
          <rect x={0} y={covY} width={1} height={covH} fill="#FDFBF6" />
          {covBars}
          <line x1={0} y1={covY + covH} x2={1} y2={covY + covH} stroke="#D9D4C7" strokeWidth={0.0008} />
        </g>
      )}

      {/* Spine */}
      <line x1={0} y1={axisY + trackH / 2 + 0.005} x2={1} y2={axisY + trackH / 2 + 0.005}
            stroke="#C8C3B4" strokeWidth={0.0012} />

      {/* VCF variants — tick marks */}
      {window.USER_VCF && Object.entries(window.USER_VCF).flatMap(([trackId, variants]) =>
        variants.map(v => {
          if (v.pos < displayStart || v.pos > displayEnd) return null;
          const x = bpToX(v.pos);
          const color = (window.VCF_COLORS && window.VCF_COLORS[v.varType]) || '#999';
          const tickHeight = v.varType === 'SV' ? 0.014 : 0.010;
          return (
            <g key={v.id}
               style={{ cursor: 'pointer' }}
               onMouseEnter={() => setHoveredId(v.id)}
               onMouseLeave={() => setHoveredId(null)}
               onClick={() => setSelectedFeature(v)}>
              <line x1={x} y1={axisY} x2={x} y2={axisY - tickHeight}
                    stroke={color} strokeWidth={0.0015}
                    opacity={hoveredId === v.id ? 1 : 0.7} />
              <circle cx={x} cy={axisY - tickHeight} r={0.0018}
                      fill={color} opacity={hoveredId === v.id ? 1 : 0.8} />
            </g>
          );
        })
      )}

      {/* CDS — forward */}
      <UText fx={0.01} fy={fwdY - 0.006} fontSize={0.013}
             fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
        → forward
      </UText>
      {visibleFeats.filter(f => f.strand >= 0).map(f => (
        <path key={f.id} d={cdsArrow(f)}
              fill={colorMap[f.category]} opacity={hoveredId === f.id ? 1 : 0.9}
              stroke={hoveredId === f.id ? "#1A1A1A" : "none"} strokeWidth={0.0015}
              style={{ cursor: 'pointer' }}
              onMouseEnter={() => setHoveredId(f.id)}
              onMouseLeave={() => setHoveredId(null)}
              onClick={() => setSelectedFeature(f)} />
      ))}

      {/* Ruler */}
      {ticks}

      {/* CDS — reverse */}
      <UText fx={0.01} fy={revY + trackH + 0.018} fontSize={0.013}
             fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
        ← reverse
      </UText>
      {visibleFeats.filter(f => f.strand < 0).map(f => (
        <path key={f.id} d={cdsArrow(f)}
              fill={colorMap[f.category]} opacity={hoveredId === f.id ? 1 : 0.9}
              stroke={hoveredId === f.id ? "#1A1A1A" : "none"} strokeWidth={0.0015}
              style={{ cursor: 'pointer' }}
              onMouseEnter={() => setHoveredId(f.id)}
              onMouseLeave={() => setHoveredId(null)}
              onClick={() => setSelectedFeature(f)} />
      ))}

      {/* Labels with row-based stacking (like Geneious) */}
      {showLabels && (() => {
        // Create items sorted by position
        const items = visibleLabels.map((lbl) => {
          const origX = bpToX(lbl.position); // original feature position (stays fixed)
          return {
            name: lbl.name,
            position: lbl.position,
            origX: origX,
            x: origX, // x position (can shift left/right for spacing)
            y: 0, // y will be set by row assignment
            color: lbl.color || '#1A1A1A',
            bold: lbl.bold,
            italic: lbl.italic,
          };
        });

        // Sort by x position (left to right) for row-based layout
        items.sort((a, b) => a.origX - b.origX);

        // Row-based stacking algorithm
        const minXGap = labelSettings.minHorizontalGap;
        const rowHeight = labelSettings.minVerticalGap + 0.010; // spacing between rows
        const isAboveMode = labelSettings.positionMode === 'above' || labelSettings.positionMode === 'alternating';
        const isBelowMode = labelSettings.positionMode === 'below' || labelSettings.positionMode === 'alternating';

        // Assign labels to rows
        const rowsAbove = []; // rows above the axis (negative direction)
        const rowsBelow = []; // rows below the axis (positive direction)

        for (const item of items) {
          const textWidth = item.name.length * labelSettings.fontSize * 0.55;
          const labelHalfWidth = textWidth / 2;

          let placed = false;

          // Try above rows first if above mode
          if (isAboveMode) {
            for (let r = 0; r < rowsAbove.length; r++) {
              const row = rowsAbove[r];
              // Check if fits in this row
              let fits = true;
              for (const other of row) {
                const otherWidth = other.name.length * labelSettings.fontSize * 0.55 / 2;
                const gap = Math.abs(item.origX - other.x);
                if (gap < minXGap + labelHalfWidth + otherWidth) {
                  fits = false;
                  break;
                }
              }
              if (fits) {
                row.push(item);
                placed = true;
                break;
              }
            }
          }

          // Try below rows if not placed and below mode enabled
          if (!placed && isBelowMode) {
            for (let r = 0; r < rowsBelow.length; r++) {
              const row = rowsBelow[r];
              let fits = true;
              for (const other of row) {
                const otherWidth = other.name.length * labelSettings.fontSize * 0.55 / 2;
                const gap = Math.abs(item.origX - other.x);
                if (gap < minXGap + labelHalfWidth + otherWidth) {
                  fits = false;
                  break;
                }
              }
              if (fits) {
                row.push(item);
                placed = true;
                break;
              }
            }
          }

          // If not placed, create new row
          if (!placed) {
            if (isAboveMode && (!isBelowMode || rowsAbove.length <= rowsBelow.length)) {
              rowsAbove.push([item]);
            } else if (isBelowMode) {
              rowsBelow.push([item]);
            } else {
              rowsAbove.push([item]);
            }
          }
        }

        // Assign Y positions based on row
        const baseY = fwdY - labelSettings.verticalOffset;
        for (let r = 0; r < rowsAbove.length; r++) {
          for (const item of rowsAbove[r]) {
            item.y = baseY - r * rowHeight;
          }
        }
        const baseYBelow = fwdY + labelSettings.verticalOffset;
        for (let r = 0; r < rowsBelow.length; r++) {
          for (const item of rowsBelow[r]) {
            item.y = baseYBelow + r * rowHeight;
          }
        }

        // Flatten back to single array
        const allRows = [...rowsAbove.reverse(), ...rowsBelow];
        const finalItems = [];
        for (const row of allRows) {
          finalItems.push(...row);
        }

        // Render labels with fading lines and better text detection
        return finalItems.map((lbl, idx) => {
          const xAnchor = lbl.origX; // feature position stays fixed
          const xLabel = lbl.origX; // labels stay at their feature position (no horizontal shifting)
          const yLabel = lbl.y;

          // Check if line passes through ANY label's text area
          let linePassesThroughText = false;

          for (const otherLbl of finalItems) {
            // Don't check against self
            if (otherLbl.name === lbl.name) continue;

            const textWidth = otherLbl.name.length * labelSettings.fontSize * 0.55;
            const textHeight = labelSettings.fontSize * 1.2;
            const otherBounds = {
              x: otherLbl.origX - textWidth / 2,
              y: otherLbl.y - textHeight / 2,
              right: otherLbl.origX + textWidth / 2,
              bottom: otherLbl.y + textHeight / 2,
            };

            // Check if this label's leader line passes through other label's text
            if (xAnchor > (otherBounds.x - labelSettings.fadeStartDistance) &&
                xAnchor < (otherBounds.right + labelSettings.fadeStartDistance)) {

              // Check if leader line would pass through text vertically
              const minLineY = Math.min(fwdY, yLabel);
              const maxLineY = Math.max(fwdY, yLabel);

              if (minLineY < otherBounds.bottom + labelSettings.fadeStartDistance &&
                  maxLineY > otherBounds.y - labelSettings.fadeStartDistance) {
                linePassesThroughText = true;
                break;
              }
            }
          }

          const shouldShowLeader = labelSettings.showLeaders;

          // Vertical leader line from feature to label row
          return (
            <g key={lbl.name}>
              {/* Simple vertical line from arrow to label */}
              {shouldShowLeader && (
                linePassesThroughText ? (
                  // If line passes through text, fade it out in the middle
                  <>
                    <path d={`M ${xAnchor} ${fwdY} L ${xAnchor} ${(fwdY + yLabel) / 2 - labelSettings.fadeStartDistance}`}
                          fill="none" stroke={lbl.color || "#1A1A1A"} strokeWidth={0.0008} opacity={0.6} />
                    <path d={`M ${xAnchor} ${(fwdY + yLabel) / 2 + labelSettings.fadeDistance} L ${xAnchor} ${yLabel}`}
                          fill="none" stroke={lbl.color || "#1A1A1A"} strokeWidth={0.0008} opacity={labelSettings.fadeOpacity} />
                  </>
                ) : (
                  // No crossing: simple clean vertical line
                  <path d={`M ${xAnchor} ${fwdY} L ${xAnchor} ${yLabel}`}
                        fill="none" stroke={lbl.color || "#1A1A1A"} strokeWidth={0.0008} opacity={0.6} />
                )
              )}
              <UText fx={xLabel} fy={yLabel}
                     textAnchor="middle" fontSize={labelSettings.fontSize} fontStyle={lbl.italic ? "italic" : "normal"}
                     fontFamily="'IBM Plex Sans', sans-serif" fontWeight={lbl.bold ? 700 : 500}
                     fill={lbl.color || "#1A1A1A"}>
                {lbl.name}
              </UText>
            </g>
          );
        });
      })()}

      {/* GC content */}
      {showGC && (
        <g>
          <UText fx={0.01} fy={gcY + 0.013} fontSize={0.013}
                 fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
            GC content
          </UText>
          <line x1={0} y1={gcY + gcH / 2} x2={1} y2={gcY + gcH / 2}
                stroke="#C8C3B4" strokeWidth={0.0008} strokeDasharray="0.004 0.004" />
          <path d={gcPath} fill="none" stroke="#3A3A3A" strokeWidth={0.0015} />
        </g>
      )}

      {/* GC skew */}
      {showSkew && (
        <g>
          <UText fx={0.01} fy={skewY + 0.013} fontSize={0.013}
                 fontFamily="'IBM Plex Mono', monospace" fill="#6A6A6A">
            GC skew
          </UText>
          <line x1={0} y1={skewY + skewH / 2} x2={1} y2={skewY + skewH / 2}
                stroke="#C8C3B4" strokeWidth={0.0008} />
          {skewBars}
        </g>
      )}
      </g>
      </svg>

      {/* Range Filter Control (top-right, always visible) */}
      <div style={{ position: 'absolute', top: 8, right: 8, zIndex: 101 }}>
        <RangeFilterControl
          genomeLen={genomeLen}
          filterStart={filterStart}
          filterEnd={filterEnd}
          onSetFilter={onSetFilter}
        />
      </div>

      {/* Customize Labels button (bottom-left) */}
      <button
        onClick={() => setShowLabelModal(true)}
        style={{
          position: 'absolute',
          bottom: 12,
          left: 12,
          padding: '8px 12px',
          fontSize: 11,
          fontFamily: "'IBM Plex Sans', sans-serif",
          background: '#D4A84A',
          color: '#1A1A1A',
          border: 'none',
          borderRadius: 4,
          cursor: 'pointer',
          fontWeight: 600,
          zIndex: 100,
        }}
      >
        ⚙ Customize labels
      </button>

      {/* Label Settings Modal */}
      {showLabelModal && (
        <LinearLabelSettingsModal
          settings={labelSettings}
          onSettingsChange={setLabelSettings}
          onClose={() => setShowLabelModal(false)}
          availableLabels={labels}
          onLabelsChange={(newLabels) => {
            // This would be passed back to parent if needed
          }}
        />
      )}
    </div>
  );
}

function niceTickStep(span) {
  const targets = [1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5, 1e6, 2e6];
  for (const t of targets) if (span / t < 14) return t;
  return 5e6;
}
function formatBp(bp) {
  if (bp >= 1e6) return (bp / 1e6).toFixed(2) + ' Mb';
  if (bp >= 1e3) return (bp / 1e3).toFixed(1) + ' kb';
  return bp + ' bp';
}

// Range Filter Control - sleek top-bar filter with real-time updates and draggable sliders
function RangeFilterControl({ genomeLen, filterStart, filterEnd, onSetFilter }) {
  const [localStart, setLocalStart] = React.useState(filterStart !== null ? filterStart : 0);
  const [localEnd, setLocalEnd] = React.useState(filterEnd !== null ? filterEnd : genomeLen);
  const sliderRef = React.useRef(null);
  const [isDragging, setIsDragging] = React.useState(null);

  const isActive = filterStart !== null && filterEnd !== null;
  const displayStart = isActive ? filterStart : localStart;
  const displayEnd = isActive ? filterEnd : localEnd;

  const sliderStartPercent = (displayStart / genomeLen) * 100;
  const sliderEndPercent = (displayEnd / genomeLen) * 100;
  const sliderWidth = sliderEndPercent - sliderStartPercent;

  const handleStartChange = (e) => {
    const val = parseInt(e.target.value) || 0;
    const clamped = Math.max(0, Math.min(val, displayEnd - 1));
    setLocalStart(clamped);
    onSetFilter(clamped, displayEnd);
  };

  const handleEndChange = (e) => {
    const val = parseInt(e.target.value) || genomeLen;
    const clamped = Math.max(displayStart + 1, Math.min(val, genomeLen));
    setLocalEnd(clamped);
    onSetFilter(displayStart, clamped);
  };

  const handleSliderMouseDown = (handle) => (e) => {
    setIsDragging(handle);
    e.preventDefault();
  };

  React.useEffect(() => {
    if (!isDragging || !sliderRef.current) return;

    const handleMouseMove = (e) => {
      const rect = sliderRef.current.getBoundingClientRect();
      const percent = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const bp = Math.round((percent / 100) * genomeLen);

      if (isDragging === 'start') {
        const clamped = Math.max(0, Math.min(bp, displayEnd - 1));
        setLocalStart(clamped);
        onSetFilter(clamped, displayEnd);
      } else if (isDragging === 'end') {
        const clamped = Math.max(displayStart + 1, Math.min(bp, genomeLen));
        setLocalEnd(clamped);
        onSetFilter(displayStart, clamped);
      }
    };

    const handleMouseUp = () => {
      setIsDragging(null);
    };

    document.addEventListener('mousemove', handleMouseMove);
    document.addEventListener('mouseup', handleMouseUp);
    return () => {
      document.removeEventListener('mousemove', handleMouseMove);
      document.removeEventListener('mouseup', handleMouseUp);
    };
  }, [isDragging, displayStart, displayEnd, genomeLen, onSetFilter]);

  return (
    <div style={{
      background: '#F5F2ED',
      border: '1px solid #D9D4C7',
      borderRadius: 4,
      padding: '6px 8px',
      fontFamily: "'IBM Plex Sans', sans-serif",
      display: 'flex',
      alignItems: 'center',
      gap: 6,
      fontSize: 10,
      color: '#6A6A6A',
      whiteSpace: 'nowrap',
    }}>
      {/* From input */}
      <input
        type="text"
        value={displayStart}
        onChange={handleStartChange}
        style={{
          width: 55,
          padding: '3px 4px',
          fontSize: 9,
          border: '1px solid #D9D4C7',
          borderRadius: 2,
          fontFamily: "'IBM Plex Mono', monospace",
          background: '#FDFBF6',
          color: '#1A1A1A',
        }}
      />

      {/* Range indicator */}
      <span style={{ color: '#999', fontSize: 9, minWidth: 16, textAlign: 'center' }}>→</span>

      {/* To input */}
      <input
        type="text"
        value={displayEnd}
        onChange={handleEndChange}
        style={{
          width: 55,
          padding: '3px 4px',
          fontSize: 9,
          border: '1px solid #D9D4C7',
          borderRadius: 2,
          fontFamily: "'IBM Plex Mono', monospace",
          background: '#FDFBF6',
          color: '#1A1A1A',
        }}
      />

      {/* Draggable slider visualization */}
      <div
        ref={sliderRef}
        style={{
          display: 'inline-block',
          position: 'relative',
          width: 70,
          height: 12,
          background: '#E5DFCF',
          borderRadius: 2,
          overflow: 'visible',
          marginLeft: 2,
          cursor: isDragging ? 'grabbing' : 'grab',
        }}
      >
        {/* Orange range area */}
        <div style={{
          position: 'absolute',
          left: `${sliderStartPercent}%`,
          width: `${sliderWidth}%`,
          height: '100%',
          background: '#D4A84A',
          opacity: 0.7,
          borderRadius: 2,
        }} />

        {/* Left handle (in orange area) */}
        <div
          onMouseDown={handleSliderMouseDown('start')}
          style={{
            position: 'absolute',
            left: `${sliderStartPercent}%`,
            top: '50%',
            transform: 'translate(-50%, -50%)',
            width: 6,
            height: 14,
            background: '#1A1A1A',
            borderRadius: 1,
            cursor: isDragging === 'start' ? 'grabbing' : 'grab',
            zIndex: isDragging === 'start' ? 10 : 2,
          }}
        />

        {/* Right handle (in orange area) */}
        <div
          onMouseDown={handleSliderMouseDown('end')}
          style={{
            position: 'absolute',
            left: `${sliderEndPercent}%`,
            top: '50%',
            transform: 'translate(-50%, -50%)',
            width: 6,
            height: 14,
            background: '#1A1A1A',
            borderRadius: 1,
            cursor: isDragging === 'end' ? 'grabbing' : 'grab',
            zIndex: isDragging === 'end' ? 10 : 2,
          }}
        />
      </div>

      {/* Range display */}
      <span style={{
        fontSize: 8,
        color: '#999',
        fontFamily: "'IBM Plex Mono', monospace",
        minWidth: 55,
      }}>
        {formatBp(displayStart)}–{formatBp(displayEnd)}
      </span>
    </div>
  );
}
